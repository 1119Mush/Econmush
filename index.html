<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EconMush — DSE Economics Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF9;
  --surface:#FFFFFF;
  --line:#EBEBE6;
  --line-strong:#D8D8D2;
  --ink:#141414;
  --muted:#9A9A94;
  --demand:#E07A5F;
  --supply:#3D7A6A;
  --gov:#6C63AC;
  --dwl:#C4453D;
  --tss:#5B7B9A;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  --dur:200ms;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Inter','Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.zh{color:var(--muted);font-weight:400}

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 12px;
  position:sticky;top:0;z-index:30;
  background:linear-gradient(var(--paper) 70%,rgba(251,251,249,0));
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.2px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--demand);box-shadow:0 0 0 3px rgba(224,122,95,.16)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn-ghost{
  font-size:13px;font-weight:500;color:var(--muted);
  padding:7px 12px;border-radius:var(--r-sm);
  transition:background var(--dur) ease-out,color var(--dur) ease-out;
}
.btn-ghost:hover{background:#F1F1EC;color:var(--ink)}
.btn-ai{
  font-size:13px;font-weight:600;letter-spacing:.02em;
  padding:7px 16px;border-radius:999px;
  background:var(--ink);color:#fff;
  transition:transform var(--dur) ease-out,opacity var(--dur) ease-out;
}
.btn-ai:active{transform:scale(.96)}

/* ---------- layout ---------- */
.workspace{
  display:flex;flex-direction:column;gap:14px;
  padding:0 14px 40px;
  max-width:1240px;margin:0 auto;
}
.chart-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.chart-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  overflow:hidden;
  position:relative;
}
#chart{display:block;width:100%;height:auto;touch-action:none;user-select:none}

.toggle-row{
  display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;
  scrollbar-width:none;
}
.toggle-row::-webkit-scrollbar{display:none}
.tog{
  flex:0 0 auto;
  font-size:12.5px;font-weight:500;letter-spacing:.01em;
  padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  transition:all var(--dur) ease-out;
  white-space:nowrap;
}
.tog.on{color:var(--ink);border-color:var(--line-strong);background:#F4F4EF}
.tog[data-key="cs"].on{color:var(--demand);border-color:rgba(224,122,95,.45);background:rgba(224,122,95,.09)}
.tog[data-key="ps"].on{color:var(--supply);border-color:rgba(61,122,106,.45);background:rgba(61,122,106,.09)}
.tog[data-key="tss"].on{color:var(--tss);border-color:rgba(91,123,154,.5);background:rgba(91,123,154,.1)}
.tog[data-key="dwl"].on{color:var(--dwl);border-color:rgba(196,69,61,.45);background:rgba(196,69,61,.09)}
.tog[data-key="tr"].on,.tog[data-key="subsidyCost"].on,.tog[data-key="incidence"].on{color:var(--gov);border-color:rgba(108,99,172,.45);background:rgba(108,99,172,.09)}
.tog.ctrl-toggle{background:var(--ink);color:#fff;border-color:var(--ink);margin-left:auto}

.readout{
  display:flex;flex-wrap:wrap;gap:7px 16px;
  padding:2px 4px;
  font-size:12.5px;color:var(--muted);
}
.readout .rv{color:var(--ink);font-weight:500}
.readout .ri{display:flex;gap:5px;align-items:baseline}

.hint{
  font-size:12.5px;color:var(--muted);
  padding:0 4px;min-height:18px;
  transition:opacity var(--dur) ease-out;
}
.hint .zh{display:block;font-size:11.5px;margin-top:1px}

/* ---------- panel ---------- */
.panel-col{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--surface);
  border-radius:20px 20px 0 0;
  border-top:1px solid var(--line);
  max-height:78vh;overflow-y:auto;
  transform:translateY(100%);
  transition:transform 220ms cubic-bezier(.32,.72,0,1);
  padding:6px 18px calc(26px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
}
.panel-col.open{transform:translateY(0)}
.sheet-handle{
  width:38px;height:4px;border-radius:99px;background:var(--line-strong);
  margin:8px auto 14px;
}
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(20,20,20,.28);
  opacity:0;pointer-events:none;transition:opacity 220ms ease-out;z-index:55;
  backdrop-filter:blur(1px);
}
.sheet-backdrop.on{opacity:1;pointer-events:auto}

.group{margin-bottom:22px}
.group-title{
  font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px;
}
.group-title .zh{
  text-transform:none;letter-spacing:0;font-weight:400;
  font-size:10.5px;margin-left:6px;
}
.ctrl{display:block;margin-bottom:15px}
.ctrl-head{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;margin-bottom:7px;
}
.ctrl-head .name{font-weight:500}
.ctrl-head .name .zh{font-size:11.5px;margin-left:6px}
.ctrl-head .val{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.ctrl-head .val.on{color:var(--gov);font-weight:600}

input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:22px;background:transparent;display:block;
  margin:0;
}
input[type=range]::-webkit-slider-runnable-track{
  height:3px;border-radius:99px;background:var(--line);
}
input[type=range]::-moz-range-track{
  height:3px;border-radius:99px;background:var(--line);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:16px;height:16px;border-radius:50%;
  background:var(--surface);border:2px solid var(--ink);
  margin-top:-6.5px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  transition:transform 120ms ease-out;
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--surface);border:2px solid var(--ink);
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range].gov::-webkit-slider-thumb{border-color:var(--gov)}
input[type=range].gov::-moz-range-thumb{border-color:var(--gov)}
input[type=range].gov::-webkit-slider-runnable-track{background:linear-gradient(90deg,rgba(108,99,172,.45),var(--line))}
input[type=range]:disabled{opacity:.35;pointer-events:none}

.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{
  flex:1;font-size:12px;font-weight:500;
  padding:8px 4px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  transition:all var(--dur) ease-out;
  line-height:1.25;
}
.seg button .zh{display:block;font-size:10px;margin-top:1px}
.seg button.on{background:rgba(108,99,172,.1);border-color:rgba(108,99,172,.45);color:var(--gov);font-weight:600}
.seg button.on .zh{color:var(--gov);opacity:.75}

.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{
  font-size:12px;font-weight:500;text-align:left;
  padding:10px 12px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:all var(--dur) ease-out;
  line-height:1.3;
}
.preset .zh{display:block;font-size:10.5px;margin-top:2px}
.preset:hover{border-color:var(--line-strong);background:#F7F7F3}
.preset:active{transform:scale(.98)}

/* ---------- Practice overlay ---------- */
.ai-overlay{
  position:fixed;inset:0;z-index:80;
  background:var(--paper);
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform 260ms cubic-bezier(.32,.72,0,1);
  visibility:hidden;
}
.ai-overlay.open{transform:translateY(0);visibility:visible}
.ai-head{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--line);
  background:var(--paper);
}
.ai-head .ttl{font-weight:600;font-size:16px}
.ai-head .ttl .zh{font-size:12px;margin-left:6px}
.icon-btn{
  width:34px;height:34px;border-radius:var(--r-sm);
  display:grid;place-items:center;font-size:17px;color:var(--muted);
  transition:background var(--dur) ease-out,color var(--dur) ease-out;
}
.icon-btn:hover{background:#F1F1EC;color:var(--ink)}
.ai-body{flex:1;overflow-y:auto;padding:22px 18px 60px;max-width:760px;width:100%;margin:0 auto}
.ai-step{display:none;animation:fadeUp 260ms ease-out}
.ai-step.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.step-label{
  font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:0 0 12px;
}
.step-label .zh{
  text-transform:none;letter-spacing:0;font-weight:400;
  font-size:11px;margin-left:6px;
}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{
  font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  transition:all var(--dur) ease-out;
  line-height:1.3;
}
.chip .zh{display:block;font-size:10.5px;margin-top:1px;opacity:.85}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on .zh{color:rgba(255,255,255,.7)}
.chip:hover:not(.on){border-color:var(--line-strong);color:var(--ink)}

.btn-primary{
  width:100%;padding:14px;border-radius:var(--r-md);
  background:var(--ink);color:#fff;font-size:14px;font-weight:600;
  transition:transform var(--dur) ease-out,opacity var(--dur) ease-out;
  line-height:1.35;
}
.btn-primary .zh{display:block;font-size:11.5px;margin-top:2px;color:rgba(255,255,255,.7);font-weight:400}
.btn-primary:active{transform:scale(.985)}
.btn-primary:disabled{opacity:.28;pointer-events:none}

.diff-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;letter-spacing:.04em;
  padding:3px 9px;border-radius:999px;
  text-transform:uppercase;
}
.diff-badge.easy{background:rgba(61,122,106,.13);color:var(--supply)}
.diff-badge.medium{background:rgba(108,99,172,.13);color:var(--gov)}
.diff-badge.hard{background:rgba(196,69,61,.13);color:var(--dwl)}

.qcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px;margin-bottom:16px;
}
.qcard .qmeta{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:12px;
  text-transform:uppercase;
}
.qcard .qmeta .dot-sep{opacity:.4}
.qcard .qtext{font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.qcard .qtext .zh{display:block;font-size:13px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

textarea{
  width:100%;min-height:190px;resize:vertical;
  font-family:inherit;font-size:14px;line-height:1.7;
  padding:15px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  outline:none;transition:border-color var(--dur) ease-out;
}
textarea:focus{border-color:var(--line-strong)}
textarea::placeholder{color:#C4C4BE}

/* report */
.rpt-block{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px 20px;margin-bottom:14px;
  animation:fadeUp 300ms ease-out both;
}
.rpt-block:nth-child(2){animation-delay:60ms}
.rpt-block:nth-child(3){animation-delay:120ms}
.rpt-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:14px}
.rpt-head .ico{font-size:15px}
.rpt-head .zh{font-size:11.5px;margin-left:4px}

.score-ring{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.ring{
  width:66px;height:66px;border-radius:50%;
  display:grid;place-items:center;
  font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;
}
.ring-cap{font-size:13px;color:var(--muted);line-height:1.5}
.ring-cap b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:2px}
.ring-cap .zh{display:block;font-size:11.5px;margin-top:2px}

.marking-card{
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:14px 15px;
  margin-bottom:10px;
  background:var(--paper);
}
.marking-card:last-child{margin-bottom:0}
.marking-card.ok{border-left:3px solid var(--supply)}
.marking-card.no{border-left:3px solid var(--dwl)}

.marking-head{
  display:flex;gap:10px;align-items:flex-start;
  font-size:13.5px;font-weight:500;line-height:1.55;margin-bottom:11px;
}
.marking-head .mark{
  flex:0 0 auto;
  width:18px;height:18px;border-radius:50%;
  display:grid;place-items:center;
  font-size:11px;font-weight:700;margin-top:1px;
}
.marking-card.ok .marking-head .mark{background:rgba(61,122,106,.14);color:var(--supply)}
.marking-card.no .marking-head .mark{background:rgba(196,69,61,.14);color:var(--dwl)}
.marking-head .zh{display:block;font-size:12px;margin-top:2px;font-weight:400}

.marking-body{padding-left:28px;display:flex;flex-direction:column;gap:8px}
.marking-row{
  display:grid;grid-template-columns:76px 1fr;gap:10px;
  font-size:12.5px;line-height:1.65;
}
.marking-row .label{color:var(--muted);font-weight:500}
.marking-row .label .zh{display:block;font-size:10.5px}
.marking-row .value{color:#3A3A35}
.marking-row .value.quote{
  font-style:italic;color:#6A6A64;background:#F4F4EF;
  padding:2px 7px;border-radius:4px;display:inline-block;word-break:break-word;
}
.marking-row .value.empty{color:#C4C4BE;font-style:italic}

.history-note{
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--muted);
  padding:9px 12px;border-radius:var(--r-sm);
  background:#F7F7F3;margin-bottom:16px;
  line-height:1.5;
}
.history-note .zh{display:block;font-size:11px;margin-top:1px}

@media (min-width:960px){
  .workspace{flex-direction:row;align-items:flex-start;gap:20px;padding:0 24px 60px}
  .chart-col{flex:1}
  .panel-col{
    position:sticky;top:74px;transform:none;
    max-height:calc(100vh - 96px);
    width:340px;flex:0 0 340px;
    border:1px solid var(--line);border-radius:var(--r-lg);
    padding:22px;overflow-y:auto;
  }
  .sheet-handle{display:none}
  .sheet-backdrop{display:none!important}
  .tog.ctrl-toggle{display:none}
  .topbar{padding:18px 24px 14px}
}
@media (max-width:400px){
  .brand{font-size:16px}
  .workspace{padding:0 10px 40px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>EconMush</div>
  <div class="top-actions">
    <button class="btn-ghost" id="resetBtn">Reset <span class="zh">重設</span></button>
    <button class="btn-ai" id="aiBtn">Practice</button>
  </div>
</header>

<main class="workspace">
  <section class="chart-col">
    <div class="chart-card">
      <svg id="chart" viewBox="0 0 600 500" aria-label="Supply and Demand Simulator"></svg>
    </div>
    <div class="toggle-row" id="toggleRow"></div>
    <div class="hint" id="hint"></div>
    <div class="readout" id="readout"></div>
  </section>

  <aside class="panel-col" id="panel">
    <div class="sheet-handle"></div>

    <div class="group">
      <div class="group-title">Market<span class="zh">市場</span></div>
      <label class="ctrl">
        <div class="ctrl-head"><span class="name">PED<span class="zh">需求彈性</span></span><span class="val" id="pedVal">—</span></div>
        <input type="range" id="pedRange" min="0" max="100" value="50">
      </label>
      <label class="ctrl">
        <div class="ctrl-head"><span class="name">PES<span class="zh">供給彈性</span></span><span class="val" id="pesVal">—</span></div>
        <input type="range" id="pesRange" min="0" max="100" value="50">
      </label>
    </div>

    <div class="group">
      <div class="group-title">Government Intervention<span class="zh">政府干預</span></div>

      <div class="ctrl">
        <div class="ctrl-head"><span class="name">Per-unit Tax<span class="zh">從量稅</span></span><span class="val" id="taxVal">—</span></div>
        <input type="range" class="gov" id="taxRange" min="0" max="40" step="1" value="0">
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span class="name">Ad Valorem Tax<span class="zh">從價稅</span></span><span class="val" id="advVal">—</span></div>
        <input type="range" class="gov" id="advRange" min="0" max="60" step="1" value="0">
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span class="name">Per-unit Subsidy<span class="zh">從量補貼</span></span><span class="val" id="subVal">—</span></div>
        <input type="range" class="gov" id="subRange" min="0" max="40" step="1" value="0">
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span class="name">Price Control<span class="zh">價格干預</span></span><span class="val" id="pcVal">—</span></div>
        <div class="seg" id="pcSeg">
          <button data-mode="none" class="on">None<span class="zh">無</span></button>
          <button data-mode="ceiling">Ceiling<span class="zh">上限</span></button>
          <button data-mode="floor">Floor<span class="zh">下限</span></button>
        </div>
        <input type="range" class="gov" id="pcRange" min="5" max="95" step="1" value="30" disabled>
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span class="name">Quota<span class="zh">配額</span></span><span class="val" id="quotaVal">—</span></div>
        <input type="range" class="gov" id="quotaRange" min="0" max="100" step="1" value="0">
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span class="name">World Price<span class="zh">世界價格</span></span><span class="val" id="worldVal">—</span></div>
        <input type="range" class="gov" id="worldRange" min="0" max="100" step="1" value="0">
      </div>
    </div>

    <div class="group" style="margin-bottom:0">
      <div class="group-title">Presets<span class="zh">情境</span></div>
      <div class="preset-grid" id="presetGrid"></div>
    </div>
  </aside>
</main>

<div class="sheet-backdrop" id="backdrop"></div>

<!-- ===================== PRACTICE OVERLAY (LOCAL ONLY) ===================== -->
<div class="ai-overlay" id="aiOverlay">
  <div class="ai-head">
    <button class="icon-btn" id="aiClose">←</button>
    <span class="ttl">Practice<span class="zh">本地練習</span></span>
    <span style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <span class="diff-badge medium" id="diffBadge">Medium</span>
    </span>
  </div>
  <div class="ai-body">

    <!-- STEP 1 -->
    <div class="ai-step on" data-step="1">
      <div class="history-note" id="historyNote" style="display:none">
        <span>📚</span>
        <span id="historyText"></span>
      </div>
      <div class="step-label">Select Topic<span class="zh">選課題</span></div>
      <div class="chips" id="topicChips"></div>
      <div class="step-label">Year<span class="zh">年份</span></div>
      <div class="chips" id="yearChips"></div>
      <div class="step-label">Question Type<span class="zh">題型</span></div>
      <div class="chips" id="typeChips"></div>
      <button class="btn-primary" id="startQuiz" disabled>Start Question<span class="zh">開始答題</span></button>
    </div>

    <!-- STEP 2 -->
    <div class="ai-step" data-step="2">
      <div class="qcard">
        <div class="qmeta" id="qMeta"></div>
        <div class="qtext" id="qText"></div>
      </div>
      <textarea id="answerBox" placeholder="Write your answer here…&#10;&#10;Tip: State the curve shift first, then equilibrium P and Q, then surplus and efficiency."></textarea>
      <div style="height:14px"></div>
      <button class="btn-primary" id="submitAns">Submit for Grading<span class="zh">提交批改</span></button>
    </div>

    <!-- STEP 3 -->
    <div class="ai-step" data-step="3">
      <div class="score-ring">
        <div class="ring" id="scoreRing"></div>
        <div class="ring-cap"><b id="scoreTitle"></b><span id="scoreSub"></span></div>
      </div>

      <div class="rpt-block">
        <div class="rpt-head"><span class="ico">📋</span>Marking Scheme Analysis<span class="zh">逐點得分分析</span></div>
        <div id="rptMarking"></div>
      </div>

      <div class="rpt-block">
        <div class="rpt-head"><span class="ico">📈</span>Question Analysis<span class="zh">題型分析</span></div>
        <div id="rptAnalysis"></div>
      </div>

      <button class="btn-primary" id="againBtn" style="margin-top:8px">Try Another<span class="zh">再練一題</span></button>
    </div>

  </div>
</div>

<script>
/* =========================================================
   EconMush v3 — Local practice + robust elasticity + TSS fix
   ========================================================= */

/* ---------- constants ---------- */
const QMAX = 100, PMAX = 100;
const VW = 600, VH = 500;
const PAD = { l: 56, r: 36, t: 28, b: 44 };
const PW = VW - PAD.l - PAD.r;
const PH = VH - PAD.t - PAD.b;

const px = q => PAD.l + (q / QMAX) * PW;
const py = p => PAD.t + PH - (p / PMAX) * PH;
const X  = q => px(q).toFixed(2);
const Y  = p => py(p).toFixed(2);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------- state ---------- */
const DEFAULT_D = () => ({ a: { q: 12, p: 88 }, b: { q: 88, p: 12 } });
const DEFAULT_S = () => ({ a: { q: 12, p: 12 }, b: { q: 88, p: 88 } });

const state = {
  demand: DEFAULT_D(),
  supply: DEFAULT_S(),
  tax: 0,
  advalorem: 0,
  subsidy: 0,
  priceCtrl: { mode: 'none', value: 30 },
  quota: 0,
  world: 0,
  show: {
    cs: false, ps: false, tss: false, dwl: false,
    tr: false, subsidyCost: false, incidence: false
  }
};

/* =========================================================
   math
   ========================================================= */
function mkLine(a, b) {
  let dq = b.q - a.q;
  const dp = b.p - a.p;
  if (Math.abs(dq) < 1e-9) dq = 1e-9;
  const m = dp / dq;
  const c = a.p - m * a.q;
  return {
    m, c,
    at: q => m * q + c,
    inv: p => Math.abs(m) < 1e-12 ? Infinity : (p - c) / m
  };
}

function intersect(L1, L2) {
  const dm = L1.m - L2.m;
  if (Math.abs(dm) < 1e-12) return null;
  const q = (L2.c - L1.c) / dm;
  return { q, p: L1.at(q) };
}

function visSeg(m, c) {
  const cands = [];
  const put = (q, p) => {
    if (q >= -0.01 && q <= 100.01 && p >= -0.01 && p <= 100.01) cands.push({ q, p });
  };
  put(0, c);
  put(100, 100 * m + c);
  if (Math.abs(m) > 1e-12) {
    put(-c / m, 0);
    put((100 - c) / m, 100);
  }
  const uniq = [];
  for (const pt of cands) {
    if (!uniq.some(u => Math.abs(u.q - pt.q) < 0.05 && Math.abs(u.p - pt.p) < 0.05)) uniq.push(pt);
  }
  if (uniq.length < 2) return null;
  uniq.sort((a, b) => a.q - b.q);
  return [uniq[0], uniq[uniq.length - 1]];
}

/* =========================================================
   core compute
   ========================================================= */
function compute() {
  const D = mkLine(state.demand.a, state.demand.b);
  const S = mkLine(state.supply.a, state.supply.b);
  const base = intersect(D, S);

  const R = {
    D, S, base, mode: 'base',
    Q: null, Pc: null, Pp: null,
    cs: 0, ps: 0, tss: 0, tr: 0, subsidyCost: 0, dwl: 0,
    taxUnit: 0, taxTotal: 0,
    consumerShare: 0, producerShare: 0,
    priceLine: null, quotaLine: null,
    worldP: null, worldQd: null, worldQs: null, trade: null
  };

  if (!base || !isFinite(base.q) || !isFinite(base.p)) return R;
  const q0 = base.q, p0 = base.p;

  const areaD = Q => (D.at(0) + D.at(Q)) / 2 * Q;
  const areaS = Q => (S.at(0) + S.at(Q)) / 2 * Q;

  if (state.world > 0) {
    const Pw = state.world;
    const Qd = D.inv(Pw), Qs = S.inv(Pw);
    R.mode = 'world';
    R.worldP = Pw; R.worldQd = Qd; R.worldQs = Qs;
    R.priceLine = Pw;
    R.Q = Qd; R.Pc = Pw; R.Pp = Pw;
    R.cs = (D.at(0) - Pw) * Qd / 2;
    R.ps = (Pw - S.at(0)) * Qs / 2;
    R.tss = R.cs + R.ps;
    R.trade = Pw < p0 ? Qd - Qs : Qs - Qd;
    R.tradeType = Pw < p0 ? 'import' : 'export';
    return R;
  }

  if (state.quota > 0) {
    const Qq = Math.min(state.quota, q0);
    const Pq = D.at(Qq);
    R.mode = 'quota';
    R.Q = Qq; R.Pc = Pq; R.Pp = Pq;
    R.quotaLine = Qq;
    R.cs = areaD(Qq) - Pq * Qq;
    R.ps = Pq * Qq - areaS(Qq);
    R.tss = R.cs + R.ps;
    R.dwl = 0.5 * Math.abs(q0 - Qq) * Math.abs(D.at(Qq) - S.at(Qq));
    return R;
  }

  if (state.priceCtrl.mode !== 'none') {
    const Pc = state.priceCtrl.value;
    R.priceLine = Pc;
    if (state.priceCtrl.mode === 'ceiling' && Pc < p0) {
      const Qs = S.inv(Pc), Qd = D.inv(Pc);
      const Q = Math.max(0, Qs);
      R.mode = 'ceiling';
      R.Q = Q; R.Pc = Pc; R.Pp = Pc;
      R.shortage = Math.max(0, Qd - Qs);
      R.cs = areaD(Q) - Pc * Q;
      R.ps = Pc * Q - areaS(Q);
      R.tss = R.cs + R.ps;
      R.dwl = 0.5 * Math.abs(q0 - Q) * Math.abs(D.at(Q) - S.at(Q));
      return R;
    }
    if (state.priceCtrl.mode === 'floor' && Pc > p0) {
      const Qd = D.inv(Pc), Qs = S.inv(Pc);
      const Q = Math.max(0, Qd);
      R.mode = 'floor';
      R.Q = Q; R.Pc = Pc; R.Pp = Pc;
      R.surplus = Math.max(0, Qs - Qd);
      R.cs = areaD(Q) - Pc * Q;
      R.ps = Pc * Q - areaS(Q);
      R.tss = R.cs + R.ps;
      R.dwl = 0.5 * Math.abs(q0 - Q) * Math.abs(D.at(Q) - S.at(Q));
      return R;
    }
  }

  if (state.tax > 0) {
    const t = state.tax;
    const Se = { m: S.m, c: S.c + t, at: q => S.at(q) + t };
    const eq = intersect(D, Se);
    if (eq && eq.q > 0) {
      const Q = eq.q, Pc = D.at(Q), Pp = S.at(Q);
      R.mode = 'tax'; R.Q = Q; R.Pc = Pc; R.Pp = Pp;
      R.taxUnit = t; R.taxTotal = Pc - Pp;
      R.cs = (D.at(0) - Pc) * Q / 2;
      R.ps = (Pp - S.at(0)) * Q / 2;
      R.tr = t * Q;
      R.tss = R.cs + R.ps + R.tr;   // TSS includes tax revenue
      R.dwl = 0.5 * t * Math.abs(q0 - Q);
      const wedge = Pc - Pp;
      R.consumerShare = wedge > 0 ? (Pc - p0) / wedge : 0;
      R.producerShare = wedge > 0 ? (p0 - Pp) / wedge : 0;
      R.incidence = { consumers: (Pc - p0) * Q, producers: (p0 - Pp) * Q };
      return R;
    }
  }

  if (state.advalorem > 0) {
    const k = 1 + state.advalorem / 100;
    const Se = { m: S.m * k, c: S.c * k, at: q => S.at(q) * k };
    const eq = intersect(D, Se);
    if (eq && eq.q > 0) {
      const Q = eq.q, Pc = D.at(Q), Pp = Pc / k;
      R.mode = 'advalorem'; R.Q = Q; R.Pc = Pc; R.Pp = Pp;
      R.taxUnit = Pc - Pp; R.taxTotal = Pc - Pp;
      R.cs = (D.at(0) - Pc) * Q / 2;
      R.ps = (Pp - S.at(0)) * Q / 2;
      R.tr = (Pc - Pp) * Q;
      R.tss = R.cs + R.ps + R.tr;
      R.dwl = 0.5 * (Pc - Pp) * Math.abs(q0 - Q);
      const wedge = Pc - Pp;
      R.consumerShare = wedge > 0 ? (Pc - p0) / wedge : 0;
      R.producerShare = wedge > 0 ? (p0 - Pp) / wedge : 0;
      R.incidence = { consumers: (Pc - p0) * Q, producers: (p0 - Pp) * Q };
      return R;
    }
  }

  if (state.subsidy > 0) {
    const s = state.subsidy;
    const Se = { m: S.m, c: S.c - s, at: q => S.at(q) - s };
    const eq = intersect(D, Se);
    if (eq && eq.q > 0) {
      const Q = eq.q, Pc = D.at(Q), Pp = S.at(Q);
      R.mode = 'subsidy'; R.Q = Q; R.Pc = Pc; R.Pp = Pp;
      R.taxUnit = Pp - Pc;
      R.cs = (D.at(0) - Pc) * Q / 2;
      R.ps = (Pp - S.at(0)) * Q / 2;
      R.subsidyCost = s * Q;
      R.tss = R.cs + R.ps - R.subsidyCost;  // TSS subtracts subsidy cost
      R.dwl = 0.5 * s * Math.abs(Q - q0);
      return R;
    }
  }

  R.mode = 'base';
  R.Q = q0; R.Pc = p0; R.Pp = p0;
  R.cs = (D.at(0) - p0) * q0 / 2;
  R.ps = (p0 - S.at(0)) * q0 / 2;
  R.tss = R.cs + R.ps;
  return R;
}

/* =========================================================
   render
   ========================================================= */
const svgEl = document.getElementById('chart');
const clampP = v => clamp(v, -60, 160);
const polyStr = pts => pts.map(([q, p]) => `${X(q)},${Y(clampP(p))}`).join(' ');

function defsStr() {
  return `<defs>
    <pattern id="patCS" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#E07A5F" opacity="0.10"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#E07A5F" stroke-width="1.3" opacity="0.42"/>
    </pattern>
    <pattern id="patPS" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#3D7A6A" opacity="0.10"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3D7A6A" stroke-width="1.3" opacity="0.42"/>
    </pattern>
    <pattern id="patTSS" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#5B7B9A" opacity="0.12"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#5B7B9A" stroke-width="1.3" opacity="0.45"/>
    </pattern>
    <pattern id="patTR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#6C63AC" opacity="0.13"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6C63AC" stroke-width="1.3" opacity="0.42"/>
    </pattern>
    <pattern id="patDWL" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#C4453D" opacity="0.16"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#C4453D" stroke-width="1.1" opacity="0.5"/>
    </pattern>
    <clipPath id="plotClip">
      <rect x="${PAD.l}" y="${PAD.t}" width="${PW}" height="${PH}"/>
    </clipPath>
  </defs>`;
}

/* clamp area vertices so extreme elasticity doesn't blow up rendering */
function areaTop(D, Q) {
  // price at Q=0, capped to chart range so triangles stay visible
  const v = D.at(0);
  return clamp(isFinite(v) ? v : 100, 0, 100);
}
function areaBot(S, Q) {
  const v = S.at(0);
  return clamp(isFinite(v) ? v : 0, 0, 100);
}

function render() {
  const R = compute();
  const s = state.show;
  const g = [defsStr()];

  for (let q = 20; q < 100; q += 20)
    g.push(`<line x1="${X(q)}" y1="${Y(0)}" x2="${X(q)}" y2="${Y(100)}" stroke="#EBEBE6" stroke-width="1"/>`);
  for (let p = 20; p < 100; p += 20)
    g.push(`<line x1="${X(0)}" y1="${Y(p)}" x2="${X(100)}" y2="${Y(p)}" stroke="#EBEBE6" stroke-width="1"/>`);

  g.push(`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(100)}" y2="${Y(0)}" stroke="#D8D8D2" stroke-width="1.4" stroke-linecap="round"/>`);
  g.push(`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(100)}" stroke="#D8D8D2" stroke-width="1.4" stroke-linecap="round"/>`);

  for (let q = 0; q <= 100; q += 20)
    g.push(`<text x="${X(q)}" y="${py(0) + 18}" text-anchor="middle" font-size="10.5" fill="#9A9A94" font-family="Inter,sans-serif">${q}</text>`);
  for (let p = 0; p <= 100; p += 20)
    g.push(`<text x="${px(0) - 10}" y="${py(p) + 3.5}" text-anchor="end" font-size="10.5" fill="#9A9A94" font-family="Inter,sans-serif">${p}</text>`);
  g.push(`<text x="${px(100)}" y="${py(0) + 34}" text-anchor="end" font-size="11" fill="#9A9A94" font-family="Inter,sans-serif">Quantity Q</text>`);
  g.push(`<text x="${px(0) - 10}" y="${py(100) - 12}" text-anchor="end" font-size="11" fill="#9A9A94" font-family="Inter,sans-serif">Price P</text>`);

  /* price line */
  if (R.priceLine !== null && R.priceLine !== undefined && state.priceCtrl.mode !== 'none') {
    const y = Y(R.priceLine);
    g.push(`<line x1="${X(0)}" y1="${y}" x2="${X(100)}" y2="${y}" stroke="#6C63AC" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
    const tag = state.priceCtrl.mode === 'ceiling' ? 'Price Ceiling' : 'Price Floor';
    g.push(`<text x="${px(100) - 4}" y="${py(R.priceLine) - 7}" text-anchor="end" font-size="11" font-weight="600" fill="#6C63AC" font-family="Inter,sans-serif">${tag}</text>`);
  }
  if (R.quotaLine !== null && R.quotaLine !== undefined && state.quota > 0) {
    g.push(`<line x1="${X(R.quotaLine)}" y1="${Y(0)}" x2="${X(R.quotaLine)}" y2="${Y(100)}" stroke="#6C63AC" stroke-width="1.6" stroke-dasharray="6 4" clip-path="url(#plotClip)"/>`);
    g.push(`<text x="${px(R.quotaLine) + 6}" y="${py(96)}" font-size="11" font-weight="600" fill="#6C63AC" font-family="Inter,sans-serif">Quota</text>`);
  }
  if (R.worldP !== null && R.worldP !== undefined) {
    g.push(`<line x1="${X(0)}" y1="${Y(R.worldP)}" x2="${X(100)}" y2="${Y(R.worldP)}" stroke="#6C63AC" stroke-width="1.6" stroke-dasharray="6 4" clip-path="url(#plotClip)"/>`);
    g.push(`<text x="${px(100) - 4}" y="${py(R.worldP) - 7}" text-anchor="end" font-size="11" font-weight="600" fill="#6C63AC" font-family="Inter,sans-serif">World Price Pw</text>`);
  }

  /* Areas */
  const Q = R.Q, Pc = R.Pc, Pp = R.Pp;

  if (Q !== null && Q > 0 && Q <= 100) {
    // CS color: prefer orange when CS toggled alone; else TSS-blue when TSS on
    const csFill = s.cs ? 'url(#patCS)' : (s.tss ? 'url(#patTSS)' : null);
    const psFill = s.ps ? 'url(#patPS)' : (s.tss ? 'url(#patTSS)' : null);

    if (csFill) {
      const topP = areaTop(R.D, Q);
      const tri = [[0, topP], [Q, Pc], [0, Pc]];
      g.push(`<polygon points="${polyStr(tri)}" fill="${csFill}" clip-path="url(#plotClip)"/>`);
    }
    if (psFill) {
      const botP = areaBot(R.S, Q);
      const tri = [[0, botP], [Q, Pp], [0, Pp]];
      g.push(`<polygon points="${polyStr(tri)}" fill="${psFill}" clip-path="url(#plotClip)"/>`);
    }
    if ((s.tr && R.tr > 0) || (s.subsidyCost && R.subsidyCost > 0)) {
      const rect = [[0, Pc], [Q, Pc], [Q, Pp], [0, Pp]];
      g.push(`<polygon points="${polyStr(rect)}" fill="url(#patTR)" clip-path="url(#plotClip)"/>`);
    }
    if (s.dwl && R.dwl > 0 && R.base && Q !== R.base.q) {
      const tri = [[Q, R.D.at(Q)], [R.base.q, R.base.p], [Q, R.S.at(Q)]];
      g.push(`<polygon points="${polyStr(tri)}" fill="url(#patDWL)" clip-path="url(#plotClip)"/>`);
    }
    if (R.mode === 'world' && R.worldP !== null && R.tradeType === 'import') {
      const qd = R.worldQd, qs = R.worldQs;
      const rect = [[qs, R.worldP], [qd, R.worldP], [qd, R.D.at(qd)], [qs, R.S.at(qs)]];
      g.push(`<polygon points="${polyStr(rect)}" fill="url(#patTR)" opacity="0.7" clip-path="url(#plotClip)"/>`);
    }
  }

  /* tax wedge */
  if ((R.mode === 'tax' || R.mode === 'advalorem') && Q !== null) {
    g.push(`<line x1="${X(Q)}" y1="${Y(Pc)}" x2="${X(Q)}" y2="${Y(Pp)}" stroke="#6C63AC" stroke-width="1.8" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
    g.push(`<line x1="${X(0)}" y1="${Y(Pc)}" x2="${X(Q)}" y2="${Y(Pc)}" stroke="#9A9A94" stroke-width="1" stroke-dasharray="3 3" clip-path="url(#plotClip)"/>`);
    g.push(`<line x1="${X(0)}" y1="${Y(Pp)}" x2="${X(Q)}" y2="${Y(Pp)}" stroke="#9A9A94" stroke-width="1" stroke-dasharray="3 3" clip-path="url(#plotClip)"/>`);
    const midP = (Pc + Pp) / 2;
    if (Math.abs(Pc - Pp) > 3)
      g.push(`<text x="${px(Q) - 8}" y="${py(midP) + 4}" text-anchor="end" font-size="11" font-weight="600" fill="#6C63AC" font-family="Inter,sans-serif">Tax Wedge ${(Pc - Pp).toFixed(1)}</text>`);
  }

  /* curves */
  const dSeg = visSeg(R.D.m, R.D.c);
  const sSeg = visSeg(R.S.m, R.S.c);
  if (dSeg) {
    g.push(`<line x1="${X(dSeg[0].q)}" y1="${Y(dSeg[0].p)}" x2="${X(dSeg[1].q)}" y2="${Y(dSeg[1].p)}" stroke="#E07A5F" stroke-width="2" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
    const end = dSeg[dSeg.length - 1];
    const labelQ = clamp(end.q, 2, 98);
    const labelP = clamp(end.p, 3, 97);
    g.push(`<text x="${X(labelQ) + (labelQ > 80 ? -14 : 10)}" y="${Y(labelP) + (labelQ > 80 ? 16 : -8)}" font-size="14" font-weight="600" fill="#E07A5F" font-family="Inter,sans-serif">D</text>`);
  }
  if (sSeg) {
    g.push(`<line x1="${X(sSeg[0].q)}" y1="${Y(sSeg[0].p)}" x2="${X(sSeg[1].q)}" y2="${Y(sSeg[1].p)}" stroke="#3D7A6A" stroke-width="2" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
    const end = sSeg[sSeg.length - 1];
    const labelQ = clamp(end.q, 2, 98);
    const labelP = clamp(end.p, 3, 97);
    g.push(`<text x="${X(labelQ) + (labelQ > 80 ? -14 : 10)}" y="${Y(labelP) + (labelQ > 80 ? 16 : -8)}" font-size="14" font-weight="600" fill="#3D7A6A" font-family="Inter,sans-serif">S</text>`);
  }

  /* shifted curves */
  if (R.mode === 'tax' && state.tax > 0) {
    const seg = visSeg(R.S.m, R.S.c + state.tax);
    if (seg) g.push(`<line x1="${X(seg[0].q)}" y1="${Y(seg[0].p)}" x2="${X(seg[1].q)}" y2="${Y(seg[1].p)}" stroke="#6C63AC" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
  }
  if (R.mode === 'advalorem' && state.advalorem > 0) {
    const k = 1 + state.advalorem / 100;
    const seg = visSeg(R.S.m * k, R.S.c * k);
    if (seg) g.push(`<line x1="${X(seg[0].q)}" y1="${Y(seg[0].p)}" x2="${X(seg[1].q)}" y2="${Y(seg[1].p)}" stroke="#6C63AC" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
  }
  if (R.mode === 'subsidy' && state.subsidy > 0) {
    const seg = visSeg(R.S.m, R.S.c - state.subsidy);
    if (seg) g.push(`<line x1="${X(seg[0].q)}" y1="${Y(seg[0].p)}" x2="${X(seg[1].q)}" y2="${Y(seg[1].p)}" stroke="#6C63AC" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
  }

  /* original equilibrium ghost */
  if (R.base && R.base.q >= 0 && R.base.q <= 100 && R.base.p >= 0 && R.base.p <= 100
      && (state.tax > 0 || state.advalorem > 0 || state.subsidy > 0 || state.priceCtrl.mode !== 'none' || state.quota > 0 || state.world > 0)) {
    g.push(`<circle cx="${X(R.base.q)}" cy="${Y(R.base.p)}" r="3.5" fill="none" stroke="#9A9A94" stroke-width="1.4" clip-path="url(#plotClip)"/>`);
  }

  /* new equilibrium dot */
  if (Q !== null && Q > 0 && Q <= 100 && Pc >= 0 && Pc <= 100) {
    g.push(`<circle cx="${X(Q)}" cy="${Y(Pc)}" r="5.5" fill="#141414" clip-path="url(#plotClip)"/>`);
    g.push(`<circle cx="${X(Q)}" cy="${Y(Pc)}" r="9" fill="none" stroke="#141414" stroke-width="1" opacity="0.18" clip-path="url(#plotClip)"/>`);
    if (R.mode === 'base')
      g.push(`<text x="${px(Q) + 12}" y="${py(Pc) - 10}" font-size="11.5" font-weight="500" fill="#141414" font-family="Inter,sans-serif">E (${Q.toFixed(0)}, ${Pc.toFixed(0)})</text>`);
  }

  /* shortage / surplus / trade labels */
  if (R.mode === 'ceiling' && R.shortage > 0 && R.priceLine !== null) {
    const y = py(R.priceLine);
    const qs = R.S.inv(R.priceLine), qd = R.D.inv(R.priceLine);
    if (isFinite(qs) && isFinite(qd)) {
      g.push(`<line x1="${X(qs)}" y1="${y}" x2="${X(qd)}" y2="${y}" stroke="#C4453D" stroke-width="2.4" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
      g.push(`<text x="${px((qs + qd) / 2)}" y="${y + 18}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C4453D" font-family="Inter,sans-serif">Shortage ${R.shortage.toFixed(1)}</text>`);
    }
  }
  if (R.mode === 'floor' && R.surplus > 0 && R.priceLine !== null) {
    const y = py(R.priceLine);
    const qd = R.D.inv(R.priceLine), qs = R.S.inv(R.priceLine);
    if (isFinite(qd) && isFinite(qs)) {
      g.push(`<line x1="${X(qd)}" y1="${y}" x2="${X(qs)}" y2="${y}" stroke="#C4453D" stroke-width="2.4" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
      g.push(`<text x="${px((qd + qs) / 2)}" y="${y - 12}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C4453D" font-family="Inter,sans-serif">Surplus ${R.surplus.toFixed(1)}</text>`);
    }
  }
  if (R.mode === 'world' && R.trade) {
    const y = py(R.worldP);
    const a = R.worldQd, b = R.worldQs;
    if (isFinite(a) && isFinite(b)) {
      g.push(`<line x1="${X(Math.min(a, b))}" y1="${y}" x2="${X(Math.max(a, b))}" y2="${y}" stroke="#6C63AC" stroke-width="2.4" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
      g.push(`<text x="${px((a + b) / 2)}" y="${y + (R.tradeType === 'import' ? 18 : -12)}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6C63AC" font-family="Inter,sans-serif">${R.tradeType === 'import' ? 'Imports' : 'Exports'} ${R.trade.toFixed(1)}</text>`);
    }
  }

  /* drag handles */
  const dh = state.demand, sh = state.supply;
  const handles = [
    { q: dh.a.q, p: dh.a.p, cls: 'demand', h: 'a' },
    { q: dh.b.q, p: dh.b.p, cls: 'demand', h: 'b' },
    { q: sh.a.q, p: sh.a.p, cls: 'supply', h: 'a' },
    { q: sh.b.q, p: sh.b.p, cls: 'supply', h: 'b' },
  ];
  const colorMap = { demand: '#E07A5F', supply: '#3D7A6A' };
  for (const H of handles) {
    const cx = X(H.q), cy = Y(H.p), col = colorMap[H.cls];
    g.push(`<circle cx="${cx}" cy="${cy}" r="17" fill="transparent" style="cursor:grab" data-drag="${H.cls}" data-handle="${H.h}"/>`);
    g.push(`<circle cx="${cx}" cy="${cy}" r="6.5" fill="#FFFFFF" stroke="${col}" stroke-width="2.2" pointer-events="none"/>`);
  }
  if (dSeg) g.push(`<line x1="${X(dSeg[0].q)}" y1="${Y(dSeg[0].p)}" x2="${X(dSeg[1].q)}" y2="${Y(dSeg[1].p)}" stroke="transparent" stroke-width="26" style="cursor:grab" data-drag="demand" clip-path="url(#plotClip)"/>`);
  if (sSeg) g.push(`<line x1="${X(sSeg[0].q)}" y1="${Y(sSeg[0].p)}" x2="${X(sSeg[1].q)}" y2="${Y(sSeg[1].p)}" stroke="transparent" stroke-width="26" style="cursor:grab" data-drag="supply" clip-path="url(#plotClip)"/>`);

  svgEl.innerHTML = g.join('');
  updateUI(R);
}

/* =========================================================
   UI update
   ========================================================= */
function fmt(n) {
  if (n === null || n === undefined || !isFinite(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1000) return Math.round(n).toLocaleString('en-US');
  return (Math.round(n * 10) / 10).toFixed(1).replace(/\.0$/, '');
}

function updateUI(R) {
  const out = [];
  if (R.Q !== null) {
    out.push(`<span class="ri">Q* <span class="rv num">${fmt(R.Q)}</span></span>`);
    if (R.mode === 'tax' || R.mode === 'advalorem') {
      out.push(`<span class="ri">P<sub>c</sub> <span class="rv num">${fmt(R.Pc)}</span></span>`);
      out.push(`<span class="ri">P<sub>p</sub> <span class="rv num">${fmt(R.Pp)}</span></span>`);
    } else {
      out.push(`<span class="ri">P* <span class="rv num">${fmt(R.Pc)}</span></span>`);
    }
  }
  if (state.show.cs) out.push(`<span class="ri">CS <span class="rv num" style="color:#E07A5F">${fmt(R.cs)}</span></span>`);
  if (state.show.ps) out.push(`<span class="ri">PS <span class="rv num" style="color:#3D7A6A">${fmt(R.ps)}</span></span>`);
  if (state.show.tss) out.push(`<span class="ri">TSS <span class="rv num" style="color:#5B7B9A;font-weight:600">${fmt(R.tss)}</span></span>`);
  if (state.show.tr && R.tr > 0) out.push(`<span class="ri">Tax Rev. <span class="rv num" style="color:#6C63AC">${fmt(R.tr)}</span></span>`);
  if (state.show.subsidyCost && R.subsidyCost > 0) out.push(`<span class="ri">Subsidy Cost <span class="rv num" style="color:#6C63AC">${fmt(R.subsidyCost)}</span></span>`);
  if (state.show.dwl) out.push(`<span class="ri">DWL <span class="rv num" style="color:#C4453D">${fmt(R.dwl)}</span></span>`);
  if (state.show.incidence && R.incidence) {
    out.push(`<span class="ri">Consumer Burden <span class="rv num" style="color:#6C63AC">${fmt(R.incidence.consumers)} (${(R.consumerShare * 100).toFixed(0)}%)</span></span>`);
    out.push(`<span class="ri">Producer Burden <span class="rv num" style="color:#6C63AC">${fmt(R.incidence.producers)} (${(R.producerShare * 100).toFixed(0)}%)</span></span>`);
  }
  document.getElementById('readout').innerHTML = out.join('');

  const hints = {
    base: { en: 'Drag the D or S curve to shift; drag endpoints to change slope.', zh: '拖動 D 或 S 曲線平移；拖端點改斜率。' },
    tax: { en: 'Tax wedge = Pc − Pp. Q falls, DWL appears.', zh: '稅楔 = 消費者價 − 生產者價。Q 下降，出現 DWL。' },
    advalorem: { en: 'Ad valorem tax rotates the S curve; tax amount varies with price.', zh: '從價稅令 S 曲線旋轉，稅額隨價格改變。' },
    subsidy: { en: 'Subsidy shifts S down. Q rises; govt cost > CS + PS gain → DWL.', zh: '補貼令 S 下移。Q 上升，政府支出 > 消費者 + 生產者得益，出現 DWL。' },
    ceiling: { en: 'Price ceiling below equilibrium → shortage.', zh: '價格上限低於均衡 → 短缺。' },
    floor: { en: 'Price floor above equilibrium → surplus.', zh: '價格下限高於均衡 → 盈餘。' },
    quota: { en: 'Quota caps quantity; price set by demand curve.', zh: '配額限制數量，價格由需求曲線決定。' },
    world: { en: 'World price below equilibrium → imports; above → exports.', zh: '世界價格低於均衡 → 進口；高於均衡 → 出口。' }
  };
  const h = hints[R.mode] || { en: '', zh: '' };
  document.getElementById('hint').innerHTML = h.en ? `${h.en}<span class="zh">${h.zh}</span>` : '';

  document.getElementById('taxVal').textContent = state.tax > 0 ? `+${state.tax}` : '0';
  document.getElementById('taxVal').classList.toggle('on', state.tax > 0);
  document.getElementById('advVal').textContent = state.advalorem > 0 ? `${state.advalorem}%` : '0%';
  document.getElementById('advVal').classList.toggle('on', state.advalorem > 0);
  document.getElementById('subVal').textContent = state.subsidy > 0 ? `-${state.subsidy}` : '0';
  document.getElementById('subVal').classList.toggle('on', state.subsidy > 0);

  const pcNames = { none: 'Off', ceiling: 'Ceiling', floor: 'Floor' };
  document.getElementById('pcVal').textContent =
    state.priceCtrl.mode === 'none' ? 'Off' : `${pcNames[state.priceCtrl.mode]} ${state.priceCtrl.value}`;
  document.getElementById('pcVal').classList.toggle('on', state.priceCtrl.mode !== 'none');

  document.getElementById('quotaVal').textContent = state.quota > 0 ? `Q = ${state.quota}` : 'Off';
  document.getElementById('quotaVal').classList.toggle('on', state.quota > 0);

  document.getElementById('worldVal').textContent = state.world > 0 ? `Pw = ${state.world}` : 'Off';
  document.getElementById('worldVal').classList.toggle('on', state.world > 0);

  /* PED/PES display */
  const ped = pedFromSlider(+document.getElementById('pedRange').value);
  const pes = pesFromSlider(+document.getElementById('pesRange').value);
  document.getElementById('pedVal').textContent = ped.label;
  document.getElementById('pesVal').textContent = pes.label;
}

/* ---------- elasticity slider mapping ---------- */
/* 0 = perfectly inelastic (vertical), 100 = perfectly elastic (horizontal), 50 = unit */
function pedFromSlider(v) {
  if (v >= 100) return { m: 0, label: '∞ (perfectly elastic)' };
  if (v <= 0) return { m: -1e6, label: '0 (perfectly inelastic)' };
  const logAbsM = 3 - 6 * (v / 100);   // 3 → -3
  const absM = Math.pow(10, logAbsM);
  const m = -absM;
  // label with approx PED at mid-point (informational)
  return { m, label: `slope ≈ ${m.toFixed(2)}` };
}

function pesFromSlider(v) {
  if (v >= 100) return { m: 0, label: '∞ (perfectly elastic)' };
  if (v <= 0) return { m: 1e6, label: '0 (perfectly inelastic)' };
  const logAbsM = 3 - 6 * (v / 100);
  const absM = Math.pow(10, logAbsM);
  const m = absM;
  return { m, label: `slope ≈ ${m.toFixed(2)}` };
}

/* =========================================================
   drag
   ========================================================= */
let drag = null;

function toData(e) {
  const rect = svgEl.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * VW;
  const y = (e.clientY - rect.top) / rect.height * VH;
  return {
    q: ((x - PAD.l) / PW) * QMAX,
    p: ((PAD.t + PH - y) / PH) * PMAX
  };
}

function clampPair(a, b) {
  const minQ = Math.min(a.q, b.q), maxQ = Math.max(a.q, b.q);
  let shiftQ = 0;
  if (minQ < 0) shiftQ = -minQ;
  else if (maxQ > 100) shiftQ = 100 - maxQ;
  a.q += shiftQ; b.q += shiftQ;

  const minP = Math.min(a.p, b.p), maxP = Math.max(a.p, b.p);
  let shiftP = 0;
  if (minP < 0) shiftP = -minP;
  else if (maxP > 100) shiftP = 100 - maxP;
  a.p += shiftP; b.p += shiftP;
  return [a, b];
}

svgEl.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]');
  if (!el) return;
  e.preventDefault();

  const which = el.dataset.drag;
  const handle = el.dataset.handle || null;
  const src = which === 'demand' ? state.demand : state.supply;

  drag = {
    which, handle,
    start: toData(e),
    orig: { a: { ...src.a }, b: { ...src.b } }
  };

  window.addEventListener('pointermove', onDragMove, { passive: false });
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', onDragEnd);
});

function onDragMove(e) {
  if (!drag) return;
  e.preventDefault();
  const pt = toData(e);
  const o = drag.orig;
  const target = drag.which === 'demand' ? state.demand : state.supply;

  if (drag.handle) {
    const other = drag.handle === 'a' ? o.b : o.a;
    let q = clamp(pt.q, 0, 100);
    let p = clamp(pt.p, 0, 100);
    if (Math.abs(q - other.q) < 4) {
      q = other.q + (q >= other.q ? 4 : -4);
      q = clamp(q, 0, 100);
    }
    target[drag.handle] = { q, p };
  } else {
    let dq = pt.q - drag.start.q;
    let dp = pt.p - drag.start.p;

    const minQ = Math.min(o.a.q, o.b.q), maxQ = Math.max(o.a.q, o.b.q);
    dq = clamp(dq, -minQ, 100 - maxQ);

    const minP = Math.min(o.a.p, o.b.p), maxP = Math.max(o.a.p, o.b.p);
    dp = clamp(dp, -minP, 100 - maxP);

    target.a = { q: o.a.q + dq, p: o.a.p + dp };
    target.b = { q: o.b.q + dq, p: o.b.p + dp };
  }
  render();
}

function onDragEnd() {
  drag = null;
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  window.removeEventListener('pointercancel', onDragEnd);
}

function clearInterventions(except) {
  if (except !== 'tax') { state.tax = 0; document.getElementById('taxRange').value = 0; }
  if (except !== 'advalorem') { state.advalorem = 0; document.getElementById('advRange').value = 0; }
  if (except !== 'subsidy') { state.subsidy = 0; document.getElementById('subRange').value = 0; }
  if (except !== 'price') { state.priceCtrl.mode = 'none'; }
  if (except !== 'quota') { state.quota = 0; document.getElementById('quotaRange').value = 0; }
  if (except !== 'world') { state.world = 0; document.getElementById('worldRange').value = 0; }

    const mode = btn.dataset.mode;

});
document.getElementById('worldRange').addEventListener('input', e => {
  clearInterventions('world'); state.world = +e.target.value; render();
});

/* rotation: keep curve centered, span large so it stays visible at extreme slopes */
function rotateCurve(pts, m) {
  const mid = { q: (pts.a.q + pts.b.q) / 2, p: (pts.a.p + pts.b.p) / 2 };
  const span = 50;
  const A = { q: mid.q - span, p: mid.p - m * span };
  const b = { q: mid.q + span, p: mid.p + m * span };
  return clampPair(A, b);
}

document.getElementById('pedRange').addEventListener('input', e => {
  const { m } = pedFromSlider(+e.target.value);
  const [a, b] = rotateCurve(state.demand, m);
  state.demand = { a, b };
  render();
});
document.getElementById('pesRange').addEventListener('input', e => {
  const { m } = pesFromSlider(+e.target.value);
  const [a, b] = rotateCurve(state.supply, m);
  state.supply = { a, b };
  render();
});

  { en: 'Price Ceiling', zh: '價格上限', apply() { state.demand = DEFAULT_D(); state.supply = DEFAULT_S(); clearInterventions('price'); state.priceCtrl = { mode: 'ceiling', value: 30 }; syncSliders(); setElasticity(50, 50); } },

  { en: 'Quota', zh: '配額', apply() { state.demand = DEFAULT_D(); state.supply = DEFAULT_S(); clearInterventions('quota'); state.quota = 30; syncSliders(); setElasticity(50, 50); } },

  { en: 'Perfectly Elastic D', zh: '完全彈性需求', apply() { state.demand = DEFAULT_D(); state.supply = DEFAULT_S(); clearInterventions(); syncSliders(); setElasticity(100, 50); } },
  { en: 'Perfectly Inelastic S', zh: '完全無彈性供給', apply() { state.demand = DEFAULT_D(); state.supply = DEFAULT_S(); clearInterventions(); syncSliders(); setElasticity(50, 0); } },
];

function setElasticity(pedV, pesV) {
  document.getElementById('pedRange').value = pedV;
  document.getElementById('pesRange').value = pesV;
  const { m: md } = pedFromSlider(pedV);
  const { m: ms } = pesFromSlider(pesV);
  const [da, db] = rotateCurve(state.demand, md);
  state.demand = { a: da, b: db };
  const [sa, sb] = rotateCurve(state.supply, ms);
  state.supply = { a: sa, b: sb };
}

function buildPresets() {
  const grid = document.getElementById('presetGrid');
  grid.innerHTML = PRESETS.map((p, i) => `<button class="preset" data-i="${i}">${p.en}<span class="zh">${p.zh}</span></button>`).join('');
  grid.querySelectorAll('.preset').forEach(btn => {
    btn.addEventListener('click', () => {
      PRESETS[+btn.dataset.i].apply();
      render();
    });
  });
}

document.getElementById('resetBtn').addEventListener('click', () => {
  state.demand = DEFAULT_D();

});

/* =========================================================
   history (for difficulty adjustment)
   ========================================================= */
const HISTORY_KEY = 'econmush_history_v2';

function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
}
function pushHistory(rec) {
  const h = getHistory();
  h.push({ ...rec, ts: Date.now() });
  if (h.length > 60) h.shift();
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); } catch {}
}

function getNextDifficulty() {
  const h = getHistory();
  if (h.length < 3) return 'medium';
  const recent = h.slice(-5);
  const avg = recent.reduce((s, r) => s + r.score / Math.max(1, r.total), 0) / recent.length;
  if (avg > 0.75) return 'hard';
  if (avg < 0.4) return 'easy';
  return 'medium';
}

function renderHistoryNote() {
  const h = getHistory();
  const note = document.getElementById('historyNote');
  const text = document.getElementById('historyText');
  if (h.length === 0) { note.style.display = 'none'; return; }
  note.style.display = 'flex';
  const recent = h.slice(-5);
  const avg = Math.round(recent.reduce((s, r) => s + r.score / Math.max(1, r.total), 0) / recent.length * 100);
  text.innerHTML = `${h.length} questions done · last 5 avg ${avg}% — difficulty auto-adjusts<span class="zh">已完成 ${h.length} 題 · 最近 5 題平均 ${avg}% · 難度自動調整</span>`;
}

function updateDiffBadge() {
  const d = getNextDifficulty();
  const badge = document.getElementById('diffBadge');
  badge.className = `diff-badge ${d}`;
  badge.textContent = d.charAt(0).toUpperCase() + d.slice(1);
}

      { t: 'Example: per-unit tax, price control, quota, monopoly', tZh: '例子：從量稅、價格干預、配額、壟斷', k: ['tax', 'price control', 'quota', 'monopoly', 'ceiling', 'floor'] },
      { t: 'Diagram: DWL triangle between Q* and efficient Q', tZh: '圖：Q* 與有效數量之間的 DWL 三角形', k: ['triangle', 'between', 'efficient', 'quantity'] }
    ],
    analysis: 'DWL definition: the loss of potential total surplus due to market not reaching Q* (where MB = MC). Causes: taxes, subsidies, price controls, quotas, monopoly, externalities. Diagram: DWL triangle between Q_traded and Q_efficient, bounded by demand and supply curves.'
  },
];

const AI_TOPICS = [
  { en: 'All', zh: '全部' },
  { en: 'Per-unit Tax', zh: '從量稅' },
  { en: 'Subsidy', zh: '補貼' },
  { en: 'Price Ceiling', zh: '價格上限' },
  { en: 'Price Floor', zh: '價格下限' },
  { en: 'Quota', zh: '配額' },
  { en: 'World Price', zh: '世界價格' },
  { en: 'Demand / Supply Shifts', zh: '需求／供給變動' },
  { en: 'PED & Total Revenue', zh: 'PED 與總收入' },
  { en: 'Consumer Surplus', zh: '消費者剩餘' },
  { en: 'Efficiency & DWL', zh: '效率與淨損失' },
  { en: 'Externalities', zh: '外部性' }
];
const AI_YEARS = ['All', '2022', '2021', '2020', '2019', '2018', '2017', '2016', '2015', '2014', '2013'];
const AI_TYPES = [
  { en: 'All', zh: '全部' },
  { en: 'Graph', zh: '圖表題' },
  { en: 'Long', zh: '長題' },
  { en: 'Short', zh: '短題' },
  { en: 'Calc', zh: '計算題' }
];

const aiSel = { topic: 'All', year: 'All', type: 'All' };
let currentQ = null;

function buildChips(containerId, arr, key) {
  const c = document.getElementById(containerId);
  c.innerHTML = arr.map(a => {
    const val = typeof a === 'string' ? a : a.en;
    const zh = typeof a === 'string' ? '' : a.zh;
    const on = aiSel[key] === val;
    return `<button class="chip${on ? ' on' : ''}" data-v="${val}">${val}${zh ? `<span class="zh">${zh}</span>` : ''}</button>`;
  }).join('');
  c.querySelectorAll('.chip').forEach(b => {
    b.addEventListener('click', () => {
      aiSel[key] = b.dataset.v;
      c.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
      checkStart();
    });
  });
}

function checkStart() { document.getElementById('startQuiz').disabled = false; }

function pickLocalQuestion(difficulty) {
  const topicMap = {
    'Per-unit Tax': 'Per-unit Tax',
    'Subsidy': 'Subsidy',
    'Price Ceiling': 'Price Ceiling',
    'Price Floor': 'Price Floor',
    'Quota': 'Quota',
    'World Price': 'World Price',
    'Demand / Supply Shifts': 'Demand / Supply Shifts',
    'PED & Total Revenue': 'PED & Total Revenue',
    'Consumer Surplus': 'Consumer Surplus',
    'Efficiency & DWL': 'Efficiency & DWL',
    'Externalities': 'Externalities'
  };
  let pool = BANK.filter(q => {
    if (aiSel.topic !== 'All' && q.topic !== topicMap[aiSel.topic]) return false;
    if (aiSel.year !== 'All' && !q.years.includes(aiSel.year)) return false;
    if (aiSel.type !== 'All' && !q.types.includes(aiSel.type)) return false;
    return true;
  });
  if (!pool.length) pool = BANK;

  // filter by difficulty (prefer exact, else adjacent)
  const exact = pool.filter(q => q.level === difficulty);
  if (exact.length) pool = exact;
  else {
    const adj = { easy: ['medium'], medium: ['easy', 'hard'], hard: ['medium'] };
    for (const alt of (adj[difficulty] || [])) {
      const sub = pool.filter(q => q.level === alt);
      if (sub.length) { pool = sub; break; }
    }
  }

  return JSON.parse(JSON.stringify(pool[Math.floor(Math.random() * pool.length)]));
}

/* =========================================================
   local grading
   ========================================================= */
function gradeLocal(question, answer) {
  const lower = answer.toLowerCase();
  const marking = question.points.map(p => {
    const found = p.k.some(k => lower.includes(k.toLowerCase()));
    let quote = '';
    if (found) {
      for (const k of p.k) {
        const idx = lower.indexOf(k.toLowerCase());
        if (idx >= 0) {
          const start = Math.max(0, idx - 12);
          const end = Math.min(answer.length, idx + k.length + 12);
          quote = (start > 0 ? '…' : '') + answer.slice(start, end) + (end < answer.length ? '…' : '');
          break;
        }
      }
    }
    return {
      point: p.t,
      point_zh: p.tZh || '',
      hit: found,
      quote,
      reason: found ? 'Keyword matched — concept present.' : 'No matching keyword — concept missing.',
      improve: found ? 'Mastered' : `Suggested: state "${p.t}"`
    };
  });
  return {
    marking,
    score: marking.filter(m => m.hit).length,
    total: marking.length,
    analysis: question.analysis
  };
}

/* =========================================================
   flow
   ========================================================= */
function goStep(n) {
  document.querySelectorAll('.ai-step').forEach(s => {
    s.classList.toggle('on', +s.dataset.step === n);
  });
  document.querySelector('.ai-body').scrollTop = 0;
  if (n === 1) {
    renderHistoryNote();
    updateDiffBadge();
  }
}

document.getElementById('startQuiz').addEventListener('click', () => {
  const difficulty = getNextDifficulty();
  const q = pickLocalQuestion(difficulty);

  currentQ = {
    topic: q.topic,
    topicZh: q.topicZh,
    years: q.years,
    types: q.types,
    level: q.level,
    q: q.q,
    qZh: q.qZh,
    points: q.points.map(p => ({ t: p.t, tZh: p.tZh, k: p.k })),
    analysis: q.analysis
  };

  const levelLabel = { easy: 'Easy', medium: 'Medium', hard: 'Hard' }[q.level] || 'Medium';
  const levelZh = { easy: '易', medium: '中', hard: '難' }[q.level] || '中';
  document.getElementById('qMeta').innerHTML =
    `<span>${q.topic}${q.topicZh ? ' · ' + q.topicZh : ''}</span>` +
    `<span class="dot-sep">·</span>` +
    `<span>${q.years[0]}</span>` +
    `<span class="dot-sep">·</span>` +
    `<span>${q.types[0]}</span>` +
    `<span class="dot-sep">·</span>` +
    `<span class="diff-badge ${q.level}">${levelLabel} · ${levelZh}</span>`;

  document.getElementById('qText').innerHTML =
    escapeHtml(q.q) + (q.qZh ? `<span class="zh">${escapeHtml(q.qZh)}</span>` : '');
  document.getElementById('answerBox').value = '';
  goStep(2);
});

document.getElementById('submitAns').addEventListener('click', () => {
  const ans = document.getElementById('answerBox').value.trim();
  if (!currentQ) return;

  const result = gradeLocal(currentQ, ans);

  const total = result.total;
  const score = result.score;
  const pct = total > 0 ? Math.round(score / total * 100) : 0;

  const ring = document.getElementById('scoreRing');
  const color = pct >= 75 ? '#3D7A6A' : pct >= 45 ? '#6C63AC' : '#C4453D';
  ring.style.background = `conic-gradient(${color} ${pct * 3.6}deg, #EBEBE6 0deg)`;
  ring.innerHTML = `<span style="background:var(--surface);width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:600;color:${color}">${pct}%</span>`;

  const gradeTitle = pct >= 75 ? 'Strong grasp' : pct >= 45 ? 'Basics in place' : 'Needs reinforcement';
  const gradeTitleZh = pct >= 75 ? '掌握得不錯' : pct >= 45 ? '基本框架已建立' : '需要補強得分點';
  document.getElementById('scoreTitle').textContent = gradeTitle;
  document.getElementById('scoreSub').innerHTML =
    `${score} / ${total} points hit${ans.length < 20 ? ' · answer too short' : ''}<span class="zh">命中 ${score} / ${total} 點 · ${gradeTitleZh}</span>`;

  document.getElementById('rptMarking').innerHTML = result.marking.map(m => {
    const cls = m.hit ? 'ok' : 'no';
    const mark = m.hit ? '✓' : '✗';
    const quoteHtml = m.quote
      ? `<span class="value quote">「${escapeHtml(m.quote)}」</span>`
      : `<span class="value empty">(no matching text found)</span>`;
    const improveHtml = m.improve && m.improve !== 'Mastered'
      ? `<div class="marking-row improve">
           <span class="label" style="color:var(--gov)">How to improve<span class="zh">改進方向</span></span>
           <span class="value" style="color:var(--gov)">${escapeHtml(m.improve)}</span>
         </div>`
      : '';
    return `
      <div class="marking-card ${cls}">
        <div class="marking-head">
          <span class="mark">${mark}</span>
          <span>${escapeHtml(m.point)}${m.point_zh ? `<span class="zh">${escapeHtml(m.point_zh)}</span>` : ''}</span>
        </div>
        <div class="marking-body">
          <div class="marking-row">
            <span class="label">Your answer<span class="zh">你的答案</span></span>
            ${quoteHtml}
          </div>
          <div class="marking-row">
            <span class="label">Reason<span class="zh">評分理由</span></span>
            <span class="value">${escapeHtml(m.reason)}</span>
          </div>
          ${improveHtml}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('rptAnalysis').innerHTML =
    `<div style="font-size:13.5px;line-height:1.8;color:#4A4A45">${escapeHtml(result.analysis || '')}</div>`;

  pushHistory({
    topic: currentQ.topic,
    year: currentQ.years[0],
    level: currentQ.level,
    score,
    total
  });

  goStep(3);
});

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

document.getElementById('againBtn').addEventListener('click', () => goStep(1));

document.getElementById('aiBtn').addEventListener('click', () => {
  document.getElementById('aiOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderHistoryNote();
  updateDiffBadge();
});
document.getElementById('aiClose').addEventListener('click', () => {
  document.getElementById('aiOverlay').classList.remove('open');
  document.body.style.overflow = '';
});

   ========================================================= */
buildToggles();
buildPresets();
buildChips('topicChips', AI_TOPICS, 'topic');
buildChips('yearChips', AI_YEARS, 'year');
buildChips('typeChips', AI_TYPES, 'type');
syncSliders();
renderHistoryNote();
updateDiffBadge();
render();
</script>
