const aiSel = { topic: 'All', year: 'All', type: 'All' };
let currentQ = null;

function buildChips(containerId, arr, key) {
  const c = document.getElementById(containerId);
  c.innerHTML = arr.map(a => {
    const val = typeof a === 'string' ? a : a.en;
    const zh = typeof a === 'string' ? '' : a.zh;
    const on = aiSel[key] === val;
    return `<button class="chip${on ? ' on' : ''}" data-v="${val}">${val}${zh ? `<span class="zh">${zh}</span>` : ''}</button>`;
  }).join('');
  c.querySelectorAll('.chip').forEach(b => {
    b.addEventListener('click', () => {
      aiSel[key] = b.dataset.v;
      c.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
      checkStart();
    });
  });
}

function checkStart() { document.getElementById('startQuiz').disabled = false; }

function pickLocalQuestion(difficulty) {
  const topicMap = {
    'Per-unit Tax': 'Per-unit Tax',
    'Subsidy': 'Subsidy',
    'Price Ceiling': 'Price Ceiling',
    'Price Floor': 'Price Floor',
    'Quota': 'Quota',
    'World Price': 'World Price',
    'Demand / Supply Shifts': 'Demand / Supply Shifts',
    'PED & Total Revenue': 'PED & Total Revenue',
    'Consumer Surplus': 'Consumer Surplus',
    'Efficiency & DWL': 'Efficiency & DWL',
    'Externalities': 'Externalities'
  };
  let pool = BANK.filter(q => {
    if (aiSel.topic !== 'All' && q.topic !== topicMap[aiSel.topic]) return false;
    if (aiSel.year !== 'All' && !q.years.includes(aiSel.year)) return false;
    if (aiSel.type !== 'All' && !q.types.includes(aiSel.type)) return false;
    return true;
  });
  if (!pool.length) pool = BANK;

  const exact = pool.filter(q => q.level === difficulty);
  if (exact.length) pool = exact;
  else {
    const adj = { easy: ['medium'], medium: ['easy', 'hard'], hard: ['medium'] };
    for (const alt of (adj[difficulty] || [])) {
      const sub = pool.filter(q => q.level === alt);
      if (sub.length) { pool = sub; break; }
    }
  }

  return JSON.parse(JSON.stringify(pool[Math.floor(Math.random() * pool.length)]));
}

function gradeLocal(question, answer) {
  const lower = answer.toLowerCase();
  const marking = question.points.map(p => {
    const found = p.k.some(k => lower.includes(k.toLowerCase()));
    let quote = '';
    if (found) {
      for (const k of p.k) {
        const idx = lower.indexOf(k.toLowerCase());
        if (idx >= 0) {
          const start = Math.max(0, idx - 12);
          const end = Math.min(answer.length, idx + k.length + 12);
          quote = (start > 0 ? '…' : '') + answer.slice(start, end) + (end < answer.length ? '…' : '');
          break;
        }
      }
    }
    return {
      point: p.t,
      point_zh: p.tZh || '',
      hit: found,
      quote,
      reason: found ? 'Keyword matched — concept present.' : 'No matching keyword — concept missing.',
      improve: found ? 'Mastered' : `Suggested: state "${p.t}"`
    };
  });
  return {
    marking,
    score: marking.filter(m => m.hit).length,
    total: marking.length,
    analysis: question.analysis
  };
}

function goStep(n) {
  document.querySelectorAll('.ai-step').forEach(s => {
    s.classList.toggle('on', +s.dataset.step === n);
  });
  document.querySelector('.ai-body').scrollTop = 0;
  if (n === 1) {
    renderHistoryNote();
    updateDiffBadge();
  }
}

document.getElementById('startQuiz').addEventListener('click', () => {
  const difficulty = getNextDifficulty();
  const q = pickLocalQuestion(difficulty);

  currentQ = {
    topic: q.topic,
    topicZh: q.topicZh,
    years: q.years,
    types: q.types,
    level: q.level,
    q: q.q,
    qZh: q.qZh,
    points: q.points.map(p => ({ t: p.t, tZh: p.tZh, k: p.k })),
    analysis: q.analysis
  };

  const levelLabel = { easy: 'Easy', medium: 'Medium', hard: 'Hard' }[q.level] || 'Medium';
  const levelZh = { easy: '易', medium: '中', hard: '難' }[q.level] || '中';
  document.getElementById('qMeta').innerHTML =
    `<span>${q.topic}${q.topicZh ? ' · ' + q.topicZh : ''}</span>` +
    `<span class="dot-sep">·</span>` +
    `<span>${q.years[0]}</span>` +
    `<span class="dot-sep">·</span>` +
    `<span>${q.types[0]}</span>` +
    `<span class="dot-sep">·</span>` +
    `<span class="diff-badge ${q.level}">${levelLabel} · ${levelZh}</span>`;

  document.getElementById('qText').innerHTML =
    escapeHtml(q.q) + (q.qZh ? `<span class="zh">${escapeHtml(q.qZh)}</span>` : '');
  document.getElementById('answerBox').value = '';
  goStep(2);
});

document.getElementById('submitAns').addEventListener('click', () => {
  const ans = document.getElementById('answerBox').value.trim();
  if (!currentQ) return;

  const result = gradeLocal(currentQ, ans);
  const total = result.total;
  const score = result.score;
  const pct = total > 0 ? Math.round(score / total * 100) : 0;

  const ring = document.getElementById('scoreRing');
  const color = pct >= 75 ? '#3D7A6A' : pct >= 45 ? '#6C63AC' : '#C4453D';
  ring.style.background = `conic-gradient(${color} ${pct * 3.6}deg, #EBEBE6 0deg)`;
  ring.innerHTML = `<span style="background:var(--surface);width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:600;color:${color}">${pct}%</span>`;

  const gradeTitle = pct >= 75 ? 'Strong grasp' : pct >= 45 ? 'Basics in place' : 'Needs reinforcement';
  const gradeTitleZh = pct >= 75 ? '掌握得不錯' : pct >= 45 ? '基本框架已建立' : '需要補強得分點';
  document.getElementById('scoreTitle').textContent = gradeTitle;
  document.getElementById('scoreSub').innerHTML =
    `${score} / ${total} points hit${ans.length < 20 ? ' · answer too short' : ''}<span class="zh">命中 ${score} / ${total} 點 · ${gradeTitleZh}</span>`;

  document.getElementById('rptMarking').innerHTML = result.marking.map(m => {
    const cls = m.hit ? 'ok' : 'no';
    const mark = m.hit ? '✓' : '✗';
    const quoteHtml = m.quote
      ? `<span class="value quote">「${escapeHtml(m.quote)}」</span>`
      : `<span class="value empty">(no matching text found)</span>`;
    const improveHtml = m.improve && m.improve !== 'Mastered'
      ? `<div class="marking-row improve">
           <span class="label" style="color:var(--gov)">How to improve<span class="zh">改進方向</span></span>
           <span class="value" style="color:var(--gov)">${escapeHtml(m.improve)}</span>
         </div>`
      : '';
    return `
      <div class="marking-card ${cls}">
        <div class="marking-head">
          <span class="mark">${mark}</span>
          <span>${escapeHtml(m.point)}${m.point_zh ? `<span class="zh">${escapeHtml(m.point_zh)}</span>` : ''}</span>
        </div>
        <div class="marking-body">
          <div class="marking-row">
            <span class="label">Your answer<span class="zh">你的答案</span></span>
            ${quoteHtml}
          </div>
          <div class="marking-row">
            <span class="label">Reason<span class="zh">評分理由</span></span>
            <span class="value">${escapeHtml(m.reason)}</span>
          </div>
          ${improveHtml}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('rptAnalysis').innerHTML =
    `<div style="font-size:13.5px;line-height:1.8;color:#4A4A45">${escapeHtml(result.analysis || '')}</div>`;

  pushHistory({
    topic: currentQ.topic,
    year: currentQ.years[0],
    level: currentQ.level,
    score,
    total
  });

  goStep(3);
});

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

document.getElementById('againBtn').addEventListener('click', () => goStep(1));

document.getElementById('aiBtn').addEventListener('click', () => {
  document.getElementById('aiOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderHistoryNote();
  updateDiffBadge();
});

  document.getElementById('aiOverlay').classList.remove('open');
  document.body.style.overflow = '';
});
