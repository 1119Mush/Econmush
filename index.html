<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EconMush — DSE Economics Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF9;
  --surface:#FFFFFF;
  --line:#EBEBE6;
  --line-strong:#D8D8D2;
  --ink:#141414;
  --muted:#9A9A94;
  --demand:#E07A5F;
  --supply:#3D7A6A;
  --gov:#6C63AC;
  --dwl:#C4453D;
  --tss:#5B7B9A;
  --consumer:#D98F6B;
  --producer:#5A9B8A;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  --dur:200ms;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Inter','Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.zh{color:var(--muted);font-weight:400}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 12px;
  position:sticky;top:0;z-index:30;
  background:linear-gradient(var(--paper) 70%,rgba(251,251,249,0));
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.2px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--demand);box-shadow:0 0 0 3px rgba(224,122,95,.16)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn-ghost{
  font-size:13px;font-weight:500;color:var(--muted);
  padding:7px 12px;border-radius:var(--r-sm);
  transition:background var(--dur) ease-out,color var(--dur) ease-out;
}
.btn-ghost:hover{background:#F1F1EC;color:var(--ink)}
.btn-ai{
  font-size:13px;font-weight:600;letter-spacing:.02em;
  padding:7px 16px;border-radius:999px;
  background:var(--ink);color:#fff;
  transition:transform var(--dur) ease-out,opacity var(--dur) ease-out;
}
.btn-ai:active{transform:scale(.96)}

.workspace{
  display:flex;flex-direction:column;gap:14px;
  padding:0 14px 40px;
  max-width:1240px;margin:0 auto;
}
.chart-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.chart-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  overflow:hidden;
  position:relative;
}
#chart{display:block;width:100%;height:auto;touch-action:none;user-select:none}

.toggle-row{
  display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;
  scrollbar-width:none;
}
.toggle-row::-webkit-scrollbar{display:none}
.tog{
  flex:0 0 auto;
  font-size:12.5px;font-weight:500;letter-spacing:.01em;
  padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  transition:all var(--dur) ease-out;
  white-space:nowrap;
}
.tog.on{color:var(--ink);border-color:var(--line-strong);background:#F4F4EF}
.tog[data-key="cs"].on{color:var(--demand);border-color:rgba(224,122,95,.45);background:rgba(224,122,95,.09)}
.tog[data-key="ps"].on{color:var(--supply);border-color:rgba(61,122,106,.45);background:rgba(61,122,106,.09)}
.tog[data-key="tss"].on{color:var(--tss);border-color:rgba(91,123,154,.5);background:rgba(91,123,154,.1)}
.tog[data-key="dwl"].on{color:var(--dwl);border-color:rgba(196,69,61,.45);background:rgba(196,69,61,.09)}
.tog[data-key="tr"].on,.tog[data-key="subsidyCost"].on{color:var(--gov);border-color:rgba(108,99,172,.45);background:rgba(108,99,172,.09)}
.tog[data-key="consumerShare"].on{color:var(--consumer);border-color:rgba(217,143,107,.5);background:rgba(217,143,107,.1)}
.tog[data-key="producerShare"].on{color:var(--producer);border-color:rgba(90,155,138,.5);background:rgba(90,155,138,.1)}
.tog.ctrl-toggle{background:var(--ink);color:#fff;border-color:var(--ink);margin-left:auto}

.readout{
  display:flex;flex-wrap:wrap;gap:7px 16px;
  padding:2px 4px;
  font-size:12.5px;color:var(--muted);
}
.readout .rv{color:var(--ink);font-weight:500}
.readout .ri{display:flex;gap:5px;align-items:baseline}
.readout .warn{color:var(--dwl);font-weight:600}

.hint{
  font-size:12.5px;color:var(--muted);
  padding:0 4px;min-height:18px;
  transition:opacity var(--dur) ease-out;
}
.hint .zh{display:block;font-size:11.5px;margin-top:1px}

.panel-col{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--surface);
  border-radius:20px 20px 0 0;
  border-top:1px solid var(--line);
  max-height:78vh;overflow-y:auto;
  transform:translateY(100%);
  transition:transform 220ms cubic-bezier(.32,.72,0,1);
  padding:6px 18px calc(26px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
}
.panel-col.open{transform:translateY(0)}
.sheet-handle{
  width:38px;height:4px;border-radius:99px;background:var(--line-strong);
  margin:8px auto 14px;
}
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(20,20,20,.28);
  opacity:0;pointer-events:none;transition:opacity 220ms ease-out;z-index:55;
  backdrop-filter:blur(1px);
}
.sheet-backdrop.on{opacity:1;pointer-events:auto}

.group{margin-bottom:22px}
.group-title{
  font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px;
}
.group-title .zh{text-transform:none;letter-spacing:0;font-weight:400;font-size:10.5px;margin-left:6px}
.ctrl{display:block;margin-bottom:15px}
.ctrl-head{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;margin-bottom:7px;
}
.ctrl-head .name{font-weight:500}
.ctrl-head .name .zh{font-size:11.5px;margin-left:6px}
.ctrl-head .val{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.ctrl-head .val.on{color:var(--gov);font-weight:600}

input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:22px;background:transparent;display:block;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:99px;background:var(--line)}
input[type=range]::-moz-range-track{height:3px;border-radius:99px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:16px;height:16px;border-radius:50%;
  background:var(--surface);border:2px solid var(--ink);
  margin-top:-6.5px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  transition:transform 120ms ease-out;
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--surface);border:2px solid var(--ink);
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range].gov::-webkit-slider-thumb{border-color:var(--gov)}
input[type=range].gov::-moz-range-thumb{border-color:var(--gov)}
input[type=range].gov::-webkit-slider-runnable-track{background:linear-gradient(90deg,rgba(108,99,172,.45),var(--line))}
input[type=range]:disabled{opacity:.35;pointer-events:none}

.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{
  flex:1;font-size:12px;font-weight:500;
  padding:8px 4px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  transition:all var(--dur) ease-out;line-height:1.25;
}
.seg button .zh{display:block;font-size:10px;margin-top:1px}
.seg button.on{background:rgba(108,99,172,.1);border-color:rgba(108,99,172,.45);color:var(--gov);font-weight:600}
.seg button.on .zh{color:var(--gov);opacity:.75}

.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{
  font-size:12px;font-weight:500;text-align:left;
  padding:10px 12px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:all var(--dur) ease-out;line-height:1.3;
}
.preset .zh{display:block;font-size:10.5px;margin-top:2px}
.preset:hover{border-color:var(--line-strong);background:#F7F7F3}
.preset:active{transform:scale(.98)}
.preset.warn{border-color:rgba(196,69,61,.4);color:var(--dwl)}

.ai-overlay{
  position:fixed;inset:0;z-index:80;
  background:var(--paper);
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform 260ms cubic-bezier(.32,.72,0,1);
  visibility:hidden;
}
.ai-overlay.open{transform:translateY(0);visibility:visible}
.ai-head{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--line);
  background:var(--paper);
}
.ai-head .ttl{font-weight:600;font-size:16px}
.ai-head .ttl .zh{font-size:12px;margin-left:6px}
.icon-btn{
  width:34px;height:34px;border-radius:var(--r-sm);
  display:grid;place-items:center;font-size:17px;color:var(--muted);
  transition:background var(--dur) ease-out,color var(--dur) ease-out;
}
.icon-btn:hover{background:#F1F1EC;color:var(--ink)}
.ai-body{flex:1;overflow-y:auto;padding:22px 18px 60px;max-width:760px;width:100%;margin:0 auto}
.ai-step{display:none;animation:fadeUp 260ms ease-out}
.ai-step.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.step-label{
  font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:0 0 12px;
}
.step-label .zh{text-transform:none;letter-spacing:0;font-weight:400;font-size:11px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{
  font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  transition:all var(--dur) ease-out;line-height:1.3;
}
.chip .zh{display:block;font-size:10.5px;margin-top:1px;opacity:.85}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on .zh{color:rgba(255,255,255,.7)}
.chip:hover:not(.on){border-color:var(--line-strong);color:var(--ink)}

.btn-primary{
  width:100%;padding:14px;border-radius:var(--r-md);
  background:var(--ink);color:#fff;font-size:14px;font-weight:600;
  transition:transform var(--dur) ease-out,opacity var(--dur) ease-out;
  line-height:1.35;
}
.btn-primary .zh{display:block;font-size:11.5px;margin-top:2px;color:rgba(255,255,255,.7);font-weight:400}
.btn-primary:active{transform:scale(.985)}
.btn-primary:disabled{opacity:.28;pointer-events:none}

.diff-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;letter-spacing:.04em;
  padding:3px 9px;border-radius:999px;
  text-transform:uppercase;
}
.diff-badge.easy{background:rgba(61,122,106,.13);color:var(--supply)}
.diff-badge.medium{background:rgba(108,99,172,.13);color:var(--gov)}
.diff-badge.hard{background:rgba(196,69,61,.13);color:var(--dwl)}

.qcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px;margin-bottom:16px;
}
.qcard .qmeta{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:12px;
  text-transform:uppercase;
}
.qcard .qmeta .dot-sep{opacity:.4}
.qcard .qtext{font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.qcard .qtext .zh{display:block;font-size:13px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

textarea{
  width:100%;min-height:190px;resize:vertical;
  font-family:inherit;font-size:14px;line-height:1.7;
  padding:15px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  outline:none;transition:border-color var(--dur) ease-out;
}
textarea:focus{border-color:var(--line-strong)}
textarea::placeholder{color:#C4C4BE}

.rpt-block{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px 20px;margin-bottom:14px;
  animation:fadeUp 300ms ease-out both;
}
.rpt-block:nth-child(2){animation-delay:60ms}
.rpt-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:14px}
.rpt-head .ico{font-size:15px}
.rpt-head .zh{font-size:11.5px;margin-left:4px}

.score-ring{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.ring{
  width:66px;height:66px;border-radius:50%;
  display:grid;place-items:center;
  font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;
}
.ring-cap{font-size:13px;color:var(--muted);line-height:1.5}
.ring-cap b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:2px}
.ring-cap .zh{display:block;font-size:11.5px;margin-top:2px}

.marking-card{
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:14px 15px;
  margin-bottom:10px;
  background:var(--paper);
}
.marking-card:last-child{margin-bottom:0}
.marking-card.ok{border-left:3px solid var(--supply)}
.marking-card.no{border-left:3px solid var(--dwl)}

.marking-head{
  display:flex;gap:10px;align-items:flex-start;
  font-size:13.5px;font-weight:500;line-height:1.55;margin-bottom:11px;
}
.marking-head .mark{
  flex:0 0 auto;
  width:18px;height:18px;border-radius:50%;
  display:grid;place-items:center;
  font-size:11px;font-weight:700;margin-top:1px;
}
.marking-card.ok .marking-head .mark{background:rgba(61,122,106,.14);color:var(--supply)}
.marking-card.no .marking-head .mark{background:rgba(196,69,61,.14);color:var(--dwl)}
.marking-head .zh{display:block;font-size:12px;margin-top:2px;font-weight:400}

.marking-body{padding-left:28px;display:flex;flex-direction:column;gap:8px}
.marking-row{
  display:grid;grid-template-columns:76px 1fr;gap:10px;
  font-size:12.5px;line-height:1.65;
}
.marking-row .label{color:var(--muted);font-weight:500}
.marking-row .label .zh{display:block;font-size:10.5px}
.marking-row .value{color:#3A3A35}
.marking-row .value.quote{
  font-style:italic;color:#6A6A64;background:#F4F4EF;
  padding:2px 7px;border-radius:4px;display:inline-block;word-break:break-word;
}
.marking-row .value.empty{color:#C4C4BE;font-style:italic}

.history-note{
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--muted);
  padding:9px 12px;border-radius:var(--r-sm);
  background:#F7F7F3;margin-bottom:16px;
  line-height:1.5;
}
.history-note .zh{display:block;font-size:11px;margin-top:1px}

@media (min-width:960px){
  .workspace{flex-direction:row;align-items:flex-start;gap:20px;padding:0 24px 60px}
  .chart-col{flex:1}
  .panel-col{
    position:sticky;top:74px;transform:none;
    max-height:calc(100vh - 96px);
    width:340px;flex:0 0 340px;
    border:1px solid var(--line);border-radius:var(--r-lg);
    padding:22px;overflow-y:auto;
  }
  .sheet-handle{display:none}
  .sheet-backdrop{display:none!important}
  .tog.ctrl-toggle{display:none}
  .topbar{padding:18px 24px 14px}
}
@media (max-width:400px){
  .brand{font-size:16px}
  .workspace{padding:0 10px 40px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>EconMush</div>
  <div class="top-actions">
    <button class="btn-ghost" id="resetBtn">Reset <span class="zh">重設</span></button>
    <button class="btn-ai" id="aiBtn">Practice</button>
  </div>
</header>

<main class="workspace">
  <section class="chart-col">
    <div class="chart-card">
      <svg id="chart" viewBox="0 0 600 500" aria-label="Supply and Demand Simulator"></svg>
    </div>
    <div class="toggle-row" id="toggleRow"></div>
    <div class="hint" id="hint"></div>
    <div class="readout" id="readout"></div>
  </section>

  <aside class="panel-col" id="panel">
    <div class="sheet-handle"></div>

    <div class="group">
      <div class="group-title">Market<span class="zh">市場</span></div>
      <label class="ctrl">
        <div class="ctrl-head"><span class="name">PED<span class="zh">需求彈性</span></span><span class="val" id="pedVal">—</span></div>
        <input type="range" id="pedRange" min="0" max="100" value="50">
      </label>
      <label class="ctrl">
        <div class="ctrl-head"><span class="name">PES<span class="zh">供給彈性</span></span><span class="val" id="pesVal">—</span></div>
        <input type="range" id="pesRange" min="0" max="100" value="50">
      </label>
    </div>

    <div class="group">
      <div class="group-title">Government Intervention<span class="zh">政府干預</span></div>

      <div class="ctrl">
        <div class="ctrl-head"><span class="name">Per-unit Tax<span class="zh">從量稅</span></span><span class="val" id="taxVal">—</span></div>
        <input type="range" class="gov" id="taxRange" min="0" max="40" step="1" value="0">
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span class="name">Ad Valorem Tax<span class="zh">從價稅</span></span><span class="val" id="advVal">—</span></div>
        <input type="range" class="gov" id="advRange" min="0" max="60" step="1" value="0">
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span class="name">Per-unit Subsidy<span class="zh">從量補貼</span></span><span class="val" id="subVal">—</span></div>
        <input type="range" class="gov" id="subRange" min="0" max="40" step="1" value="0">
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span class="name">Price Control<span class="zh">價格干預</span></span><span class="val" id="pcVal">—</span></div>
        <div class="seg" id="pcSeg">
          <button data-mode="none" class="on">None<span class="zh">無</span></button>
          <button data-mode="ceiling">Ceiling<span class="zh">上限</span></button>
          <button data-mode="floor">Floor<span class="zh">下限</span></button>
        </div>
        <input type="range" class="gov" id="pcRange" min="5" max="95" step="1" value="30" disabled>
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span class="name">Quota<span class="zh">配額</span></span><span class="val" id="quotaVal">—</span></div>
        <input type="range" class="gov" id="quotaRange" min="0" max="100" step="1" value="0">
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span class="name">World Price<span class="zh">世界價格</span></span><span class="val" id="worldVal">—</span></div>
        <input type="range" class="gov" id="worldRange" min="0" max="100" step="1" value="0">
      </div>
    </div>

    <div class="group" style="margin-bottom:0">
      <div class="group-title">Presets<span class="zh">情境</span></div>
      <div class="preset-grid" id="presetGrid"></div>
    </div>
  </aside>
</main>

<div class="sheet-backdrop" id="backdrop"></div>

<div class="ai-overlay" id="aiOverlay">
  <div class="ai-head">
    <button class="icon-btn" id="aiClose">←</button>
    <span class="ttl">Practice<span class="zh">本地練習</span></span>
    <span style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <span class="diff-badge medium" id="diffBadge">Medium</span>
    </span>
  </div>
  <div class="ai-body">

    <div class="ai-step on" data-step="1">
      <div class="history-note" id="historyNote" style="display:none">
        <span>📚</span>
        <span id="historyText"></span>
      </div>
      <div class="step-label">Select Topic<span class="zh">選課題</span></div>
      <div class="chips" id="topicChips"></div>
      <div class="step-label">Year<span class="zh">年份</span></div>
      <div class="chips" id="yearChips"></div>
      <div class="step-label">Question Type<span class="zh">題型</span></div>
      <div class="chips" id="typeChips"></div>
      <button class="btn-primary" id="startQuiz" disabled>Start Question<span class="zh">開始答題</span></button>
    </div>

    <div class="ai-step" data-step="2">
      <div class="qcard">

      <div class="rpt-block">
        <div class="rpt-head"><span class="ico">📋</span>Marking Scheme Analysis<span class="zh">逐點得分分析</span></div>
        <div id="rptMarking"></div>

      <div class="rpt-block">
        <div class="rpt-head"><span class="ico">📈</span>Question Analysis<span class="zh">題型分析</span></div>
        <div id="rptAnalysis"></div>

      <button class="btn-primary" id="againBtn" style="margin-top:8px">Try Another<span class="zh">再練一題</span></button>
    </div>

  </div>
</div>

<script>
/* =========================================================
   EconMush v5 — Fully robust for all elasticity extremes
   ---------------------------------------------------------
   核心改動：
   1. 曲線用「座標對」儲存，唔靠斜率，避免 Infinity 問題
   2. 用 universal region builder 處理所有 CS/PS/DWL 形狀
   3. 完全彈性 / 完全無彈性 分別用唔同方式搵交點
   4. 所有依賴 inv() 嘅位都加 fallback
   5. 平行曲線、無交點 → 顯示警告，唔畫錯誤圖
   ========================================================= */

const QMAX = 100, PMAX = 100;
const VW = 600, VH = 500;
const PAD = { l: 56, r: 36, t: 28, b: 44 };
const PW = VW - PAD.l - PAD.r;
const PH = VH - PAD.t - PAD.b;

const px = q => PAD.l + (q / QMAX) * PW;
const py = p => PAD.t + PH - (p / PMAX) * PH;
const X  = q => px(q).toFixed(2);
const Y  = p => py(p).toFixed(2);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const isFiniteNum = v => typeof v === 'number' && isFinite(v);

/* =========================================================
   Curve representation
   ---------------------------------------------------------
   一條線可以用三種方式表達：
   - 'normal'   : 普通斜線 y = mq + c（m 有限）
   - 'vertical' : 完全無彈性，q = q0（固定數量）
   - 'horizontal': 完全彈性，p = p0（固定價格）
   用 curveAtP / curveAtQ 統一讀取，唔會出現 Infinity。
   ========================================================= */
function makeCurve(a, b) {
  const dq = b.q - a.q;
  const dp = b.p - a.p;

  // 完全無彈性：垂直線
  if (Math.abs(dq) < 1e-6) {
    return {
      type: 'vertical',
      q0: a.q,
      // 垂直線「在數量 q 的價格」冇定義，用 p 範圍表示
      pMin: Math.min(a.p, b.p),
      pMax: Math.max(a.p, b.p),
      at: q => (Math.abs(q - a.q) < 1e-6 ? null : null),  // 唔應該用 at
      inv: p => a.q,   // 任何 p 都對應 q = a.q
      // 對外介面
      qAtP: p => a.q,
      pAtQ: q => (Math.abs(q - a.q) < 1e-6 ? null : null),
      // 判斷是否包含某個 p
      containsP: p => p >= Math.min(a.p, b.p) - 1e-6 && p <= Math.max(a.p, b.p) + 1e-6,
      isVertical: true,
      isHorizontal: false,
      slope: Infinity,
      raw: { a: { ...a }, b: { ...b } }
    };
  }

  // 完全彈性：水平線
  if (Math.abs(dp) < 1e-6) {
    return {
      type: 'horizontal',
      p0: a.p,
      qMin: Math.min(a.q, b.q),
      qMax: Math.max(a.q, b.q),
      at: q => a.p,
      inv: p => (Math.abs(p - a.p) < 1e-6 ? null : null),  // 唔應該用 inv
      qAtP: p => (Math.abs(p - a.p) < 1e-6 ? null : null),
      pAtQ: q => a.p,
      containsQ: q => q >= Math.min(a.q, b.q) - 1e-6 && q <= Math.max(a.q, b.q) + 1e-6,
      isVertical: false,
      isHorizontal: true,
      slope: 0,
      raw: { a: { ...a }, b: { ...b } }
    };
  }

  // 普通斜線
  const m = dp / dq;
  const c = a.p - m * a.q;
  return {
    type: 'normal',
    m, c,
    at: q => m * q + c,
    inv: p => (p - c) / m,
    qAtP: p => (p - c) / m,
    pAtQ: q => m * q + c,
    containsQ: q => q >= Math.min(a.q, b.q) - 1e-6 && q <= Math.max(a.q, b.q) + 1e-6,
    containsP: p => p >= Math.min(a.p, b.p) - 1e-6 && p <= Math.max(a.p, b.p) + 1e-6,
    isVertical: false,
    isHorizontal: false,
    slope: m,
    raw: { a: { ...a }, b: { ...b } }
  };
}

/* =========================================================
   交點計算：覆蓋所有 4 種組合
   ========================================================= */
function intersectCurves(D, S) {
  // vertical vs vertical：平行，冇交點
  if (D.isVertical && S.isVertical) return null;

  // horizontal vs horizontal：平行，冇交點
  if (D.isHorizontal && S.isHorizontal) return null;

  // vertical D & horizontal S
  if (D.isVertical && S.isHorizontal) {
    if (D.containsP(S.p0)) return { q: D.q0, p: S.p0 };
    return null;
  }
  // horizontal D & vertical S
  if (D.isHorizontal && S.isVertical) {
    if (S.containsP(D.p0)) return { q: S.q0, p: D.p0 };
    return null;
  }

  // vertical D + normal S
  if (D.isVertical && S.type === 'normal') {
    const p = S.at(D.q0);
    if (isFiniteNum(p)) return { q: D.q0, p };
    return null;
  }
  // normal D + vertical S
  if (D.type === 'normal' && S.isVertical) {
    const p = D.at(S.q0);
    if (isFiniteNum(p)) return { q: S.q0, p };
    return null;
  }

  // horizontal D + normal S
  if (D.isHorizontal && S.type === 'normal') {
    const q = S.inv(D.p0);
    if (isFiniteNum(q)) return { q, p: D.p0 };
    return null;
  }
  // normal D + horizontal S
  if (D.type === 'normal' && S.isHorizontal) {
    const q = D.inv(S.p0);
    if (isFiniteNum(q)) return { q, p: S.p0 };
    return null;
  }

  // 兩個 normal：標準交點
  if (D.type === 'normal' && S.type === 'normal') {
    const dm = D.m - S.m;
    if (Math.abs(dm) < 1e-12) return null;  // 平行
    const q = (S.c - D.c) / dm;
    if (!isFiniteNum(q)) return null;
    return { q, p: D.at(q) };
  }

  return null;
}

/* =========================================================
   給定一條曲線 + 某個 p，搵對應 q（用於價格上限/下限）
   回傳：q 或 null（表示該 p 唔在曲線範圍內）
   ========================================================= */
function qOnCurveAtP(curve, p) {
  if (curve.isVertical) {
    return curve.containsP(p) ? curve.q0 : null;
  }
  if (curve.isHorizontal) {
    return Math.abs(p - curve.p0) < 1e-6 ? null : null;  // 水平線冇「對應 q」
  }
  const q = curve.inv(p);
  if (!isFiniteNum(q)) return null;
  return q;
}

/* 給定一條曲線 + 某個 q，搵對應 p */
function pOnCurveAtQ(curve, q) {
  if (curve.isHorizontal) return curve.p0;
  if (curve.isVertical) {
    return Math.abs(q - curve.q0) < 1e-6 ? null : null;
  }
  const p = curve.at(q);
  return isFiniteNum(p) ? p : null;
}

/* =========================================================
   狀態
   ========================================================= */
const DEFAULT_D = () => ({ a: { q: 12, p: 88 }, b: { q: 88, p: 12 } });
const DEFAULT_S = () => ({ a: { q: 12, p: 12 }, b: { q: 88, p: 88 } });

const state = {
  demand: DEFAULT_D(),
  supply: DEFAULT_S(),
  tax: 0,
  advalorem: 0,
  subsidy: 0,
  priceCtrl: { mode: 'none', value: 30 },
  quota: 0,
  world: 0,
  show: {
    cs: false, ps: false, tss: false, dwl: false,
    tr: false, subsidyCost: false,
    consumerShare: false, producerShare: false
  }
};

/* =========================================================
   Universal region builder
   ---------------------------------------------------------
   畫 CS 或 PS 面積時，唔可以假設形狀係三角形。
   用「四角 (0,P_left) → (Q_right,P_left) → (Q_right,P_right) → (0,P_right)」
   再加「曲線切割」產生多邊形。
   ========================================================= */
function buildAreaPolygon({
  qLeft,     // 左邊界 q（通常 0）
  qRight,    // 右邊界 q
  pTop,      // 上面價格（水平）
  pBottom,   // 下面價格（水平）
  curveSide  // 'top' 表示曲線在上面（CS）；'bottom' 表示曲線在下面（PS）
}) {
  // 產生一個四邊形，然後用曲線「替換」上面或下面嘅邊
  if (!isFiniteNum(qLeft) || !isFiniteNum(qRight) || qRight <= qLeft) return null;
  if (!isFiniteNum(pTop) || !isFiniteNum(pBottom)) return null;

  const poly = [];
  if (curveSide === 'top') {
    // 上面係曲線，下面係 pBottom
    // 左邊界
    poly.push([qLeft, pTop]);  // 用 pTop 作 fallback（曲線在 qLeft 的值）
    // 曲線從 qLeft 到 qRight
    const steps = 24;
    for (let i = 0; i <= steps; i++) {
      const q = qLeft + (qRight - qLeft) * i / steps;
      let pCurve = null;
      if (curveIsDefined) {
        pCurve = pOnCurveAtQ(curveIsDefined, q);
      }
      // fallback：如果曲線喺呢個 q 冇定義，用 pTop
      const p = isFiniteNum(pCurve) ? Math.max(pCurve, pBottom) : pTop;
      poly.push([q, p]);
    }
    // 右邊界向下到 pBottom
    poly.push([qRight, pBottom]);
    // 返去左邊界
    poly.push([qLeft, pBottom]);
  } else {
    // 下面係曲線，上面係 pTop
    poly.push([qLeft, pTop]);
    poly.push([qRight, pTop]);
    // 右邊界向下
    // 曲線從 qRight 到 qLeft
    const steps = 24;
    for (let i = 0; i <= steps; i++) {
      const q = qRight - (qRight - qLeft) * i / steps;
      let pCurve = null;
      if (curveIsDefined) {
        pCurve = pOnCurveAtQ(curveIsDefined, q);
      }
      const p = isFiniteNum(pCurve) ? Math.min(pCurve, pTop) : pBottom;
      poly.push([q, p]);
    }
    poly.push([qLeft, pBottom]);
  }

  return poly;

  // 內部變數（為了 closure 簡單）
  var curveIsDefined = null;
}

/* 上面嗰個 builder 有 closure 問題，改用顯式傳參數 */
function buildCSArea(D, qRight, pConsumer) {
  if (!isFiniteNum(qRight) || qRight <= 0 || !isFiniteNum(pConsumer)) return null;

  // 特別處理：D 為 horizontal
  if (D.isHorizontal) {
    // CS = (p_D - pConsumer) × qRight，係長方形（如果 p_D > pConsumer）
    if (D.p0 <= pConsumer) return null;  // 冇 CS
    return [
      [0, D.p0],
      [qRight, D.p0],
      [qRight, pConsumer],
      [0, pConsumer]
    ];
  }

  // D 為 vertical
  if (D.isVertical) {
    // 垂直 D：消費者只願意喺 q = D.q0 買
    // 如果 qRight == D.q0，CS 係一條垂直線（面積 0）
    if (Math.abs(qRight - D.q0) > 1e-6) return null;
    return null;  // 面積 0，唔畫
  }

  // D 為 normal
  const p0 = D.at(0);
  const pAtQ = D.at(qRight);
  if (!isFiniteNum(p0) || !isFiniteNum(pAtQ)) return null;

  // 如果 pAtQ < pConsumer，冇 CS（因為消費者唔會買）
  if (pAtQ < pConsumer - 1e-6) return null;

  // 檢查形狀：如果 pAtQ 同 pConsumer 幾乎相等 → 三角形（簡化為 3 點）
  if (Math.abs(pAtQ - pConsumer) < 0.5) {
    return [
      [0, p0],
      [qRight, pConsumer],
      [0, pConsumer]
    ];
  }

  // 否則係梯形 / 曲邊梯形
  return [
    [0, p0],
    [qRight, pAtQ],
    [qRight, pConsumer],
    [0, pConsumer]
  ];
}

function buildPSArea(S, qRight, pProducer) {
  if (!isFiniteNum(qRight) || qRight <= 0 || !isFiniteNum(pProducer)) return null;

  // 特別處理：S 為 horizontal
  if (S.isHorizontal) {
    // PS = (pProducer - p_S) × qRight，係長方形
    if (pProducer <= S.p0) return null;
    return [
      [0, pProducer],
      [qRight, pProducer],
      [qRight, S.p0],
      [0, S.p0]
    ];
  }

  // S 為 vertical
  if (S.isVertical) {
    if (Math.abs(qRight - S.q0) > 1e-6) return null;
    return null;
  }

  // S 為 normal
  const p0 = S.at(0);
  const pAtQ = S.at(qRight);
  if (!isFiniteNum(p0) || !isFiniteNum(pAtQ)) return null;

  if (pAtQ > pProducer + 1e-6) return null;

  // 三角形
  if (Math.abs(pAtQ - pProducer) < 0.5) {
    return [
      [0, pProducer],
      [qRight, pProducer],
      [0, p0]
    ];
  }

  // 梯形
  return [
    [0, pProducer],
    [qRight, pProducer],
    [qRight, pAtQ],
    [0, p0]
  ];
}

/* =========================================================
   核心計算
   ========================================================= */
function compute() {
  const D = makeCurve(state.demand.a, state.demand.b);
  const S = makeCurve(state.supply.a, state.supply.b);
  const base = intersectCurves(D, S);

  const R = {
    D, S, base, mode: 'base',
    Q_traded: null, Pc: null, Pp: null,
    P0: base ? base.p : null, Q0: base ? base.q : null,
    cs: 0, ps: 0, tss: 0, tr: 0, subsidyCost: 0, dwl: 0,
    consumerBurden: 0, producerBurden: 0,
    priceLine: null, quotaLine: null,
    worldP: null, worldQd: null, worldQs: null, trade: null,
    csPoly: null, psPoly: null,
    warning: null,
    tradeType: null,
    shortage: 0, surplus: 0
  };

  if (!base) {
    R.warning = 'No intersection — curves are parallel or do not cross.';
    return R;
  }

  const q0 = base.q, p0 = base.p;

  /* ---------- world price ---------- */
  if (state.world > 0) {
    const Pw = state.world;
    // 喺 Pw 水平線上搵 Qd 同 Qs
    const Qd = D.isVertical ? (D.containsP(Pw) ? D.q0 : null)
              : D.isHorizontal ? (Pw === D.p0 ? Infinity : 0)
              : D.inv(Pw);
    const Qs = S.isVertical ? (S.containsP(Pw) ? S.q0 : null)
              : S.isHorizontal ? (Pw === S.p0 ? Infinity : 0)
              : S.inv(Pw);

    // 如果其中一個係 null（價格唔喺曲線範圍）→ 唔算有效世界價格
    if (Qd === null || Qs === null || !isFiniteNum(Qd) || !isFiniteNum(Qs)) {
      // fallback：當做冇貿易，跳去 base
    } else {
      R.mode = 'world';
      R.worldP = Pw; R.worldQd = Qd; R.worldQs = Qs;
      R.priceLine = Pw;
      R.Pc = Pw; R.Pp = Pw;

      // 決定進口定出口
      if (Qd > Qs) {
        R.tradeType = 'import';
        R.trade = Qd - Qs;
        R.Q_traded = Qd;
        // CS 用 Qd，PS 用 Qs
        const p0D = D.isNormal ? D.at(0) : (D.isHorizontal ? D.p0 : null);
        const p0S = S.isNormal ? S.at(0) : (S.isHorizontal ? S.p0 : null);
        R.cs = isFiniteNum(p0D) ? (p0D - Pw) * Qd / 2 : 0;
        R.ps = isFiniteNum(p0S) ? (Pw - p0S) * Qs / 2 : 0;
        R.csPoly = buildCSArea(D, Qd, Pw);
        R.psPoly = buildPSArea(S, Qs, Pw);
      } else if (Qs > Qd) {
        R.tradeType = 'export';
        R.trade = Qs - Qd;
        R.Q_traded = Qd;
        const p0D = D.isNormal ? D.at(0) : (D.isHorizontal ? D.p0 : null);
        const p0S = S.isNormal ? S.at(0) : (S.isHorizontal ? S.p0 : null);
        R.cs = isFiniteNum(p0D) ? (p0D - Pw) * Qd / 2 : 0;
        R.ps = isFiniteNum(p0S) ? (Pw - p0S) * Qs / 2 : 0;
        R.csPoly = buildCSArea(D, Qd, Pw);
        R.psPoly = buildPSArea(S, Qs, Pw);
      } else {
        R.mode = 'base';
        R.Q_traded = q0; R.Pc = p0; R.Pp = p0;
      }
      R.tss = R.cs + R.ps;
      return R;
    }
  }

  /* ---------- quota ---------- */
  if (state.quota > 0) {
    const Qq = Math.min(state.quota, q0);
    const Pq = pOnCurveAtQ(D, Qq);
    if (isFiniteNum(Pq)) {
      R.mode = 'quota';
      R.Q_traded = Qq; R.Pc = Pq; R.Pp = Pq;
      R.quotaLine = Qq;
      R.cs = calcCSArea(D, Qq, Pq);
      R.ps = calcPSArea(S, Qq, Pq);
      R.tss = R.cs + R.ps;
      R.dwl = 0.5 * Math.abs(q0 - Qq) * Math.abs(pOnCurveAtQ(D, Qq) - pOnCurveAtQ(S, Qq));
      R.csPoly = buildCSArea(D, Qq, Pq);
      R.psPoly = buildPSArea(S, Qq, Pq);
      return R;
    }
  }

  /* ---------- price ceiling ---------- */
  if (state.priceCtrl.mode === 'ceiling' && state.priceCtrl.value < p0) {
    const Pc = state.priceCtrl.value;
    const Qs = qOnCurveAtP(S, Pc);
    const Qd = qOnCurveAtP(D, Pc);

    if (isFiniteNum(Qs) && isFiniteNum(Qd)) {
      const Q = Math.max(0, Qs);
      R.mode = 'ceiling';
      R.priceLine = Pc;
      R.Q_traded = Q; R.Pc = Pc; R.Pp = Pc;
      R.shortage = Math.max(0, Qd - Qs);
      R.cs = calcCSArea(D, Q, Pc);
      R.ps = calcPSArea(S, Q, Pc);
      R.tss = R.cs + R.ps;
      R.dwl = 0.5 * Math.abs(q0 - Q) * Math.abs(pOnCurveAtQ(D, Q) - pOnCurveAtQ(S, Q));
      R.csPoly = buildCSArea(D, Q, Pc);
      R.psPoly = buildPSArea(S, Q, Pc);
      return R;
    }
  }

  /* ---------- price floor ---------- */
  if (state.priceCtrl.mode === 'floor' && state.priceCtrl.value > p0) {
    const Pf = state.priceCtrl.value;
    const Qd = qOnCurveAtP(D, Pf);
    const Qs = qOnCurveAtP(S, Pf);

    if (isFiniteNum(Qd) && isFiniteNum(Qs)) {
      const Q = Math.max(0, Qd);
      R.mode = 'floor';
      R.priceLine = Pf;
      R.Q_traded = Q; R.Pc = Pf; R.Pp = Pf;
      R.surplus = Math.max(0, Qs - Qd);
      R.cs = calcCSArea(D, Q, Pf);
      R.ps = calcPSArea(S, Q, Pf);
      R.tss = R.cs + R.ps;
      R.dwl = 0.5 * Math.abs(q0 - Q) * Math.abs(pOnCurveAtQ(D, Q) - pOnCurveAtQ(S, Q));
      R.csPoly = buildCSArea(D, Q, Pf);
      R.psPoly = buildPSArea(S, Q, Pf);
      return R;
    }
  }

  /* ---------- per-unit tax ---------- */
  if (state.tax > 0) {
    const t = state.tax;
    // S 向上移 t：只對 normal / horizontal 有效
    let Se = null;
    if (S.type === 'normal') {
      Se = makeCurve({ q: S.raw.a.q, p: S.raw.a.p + t }, { q: S.raw.b.q, p: S.raw.b.p + t });
    } else if (S.isHorizontal) {
      Se = makeCurve({ q: S.raw.a.q, p: S.raw.a.p + t }, { q: S.raw.b.q, p: S.raw.b.p + t });
    } else if (S.isVertical) {
      // 垂直 S 向上移，仍然係同一條 vertical
      Se = makeCurve({ q: S.q0, p: S.pMin + t }, { q: S.q0, p: S.pMax + t });
    }

    if (Se) {
      const eq = intersectCurves(D, Se);
      if (eq && eq.q > 0 && isFiniteNum(eq.p)) {
        const Q = eq.q;
        const Pc = pOnCurveAtQ(D, Q);       // 消費者價格
        const Pp = Pc - t;                  // 生產者價格 = Pc - t

        R.mode = 'tax';
        R.Q_traded = Q; R.Pc = Pc; R.Pp = Pp;
        R.cs = calcCSArea(D, Q, Pc);
        R.ps = calcPSArea(S, Q, Pp);
        R.tr = t * Q;
        R.tss = R.cs + R.ps + R.tr;
        R.dwl = 0.5 * t * Math.abs(q0 - Q);
        R.consumerBurden = (Pc - p0) * Q;
        R.producerBurden = (p0 - Pp) * Q;
        R.csPoly = buildCSArea(D, Q, Pc);
        R.psPoly = buildPSArea(S, Q, Pp);
        return R;
      }
    }
  }

  /* ---------- ad valorem tax ---------- */
  if (state.advalorem > 0) {
    const k = 1 + state.advalorem / 100;
    let Se = null;
    if (S.type === 'normal') {
      Se = makeCurve(
        { q: S.raw.a.q, p: S.raw.a.p * k },
        { q: S.raw.b.q, p: S.raw.b.p * k }
      );
    } else if (S.isHorizontal) {
      Se = makeCurve(
        { q: S.raw.a.q, p: S.raw.a.p * k },
        { q: S.raw.b.q, p: S.raw.b.p * k }
      );
    } else if (S.isVertical) {
      Se = makeCurve({ q: S.q0, p: S.pMin * k }, { q: S.q0, p: S.pMax * k });
    }

    if (Se) {
      const eq = intersectCurves(D, Se);
      if (eq && eq.q > 0 && isFiniteNum(eq.p)) {
        const Q = eq.q;
        const Pc = pOnCurveAtQ(D, Q);
        const Pp = Pc / k;

        R.mode = 'advalorem';
        R.Q_traded = Q; R.Pc = Pc; R.Pp = Pp;
        R.cs = calcCSArea(D, Q, Pc);
        R.ps = calcPSArea(S, Q, Pp);
        R.tr = (Pc - Pp) * Q;
        R.tss = R.cs + R.ps + R.tr;
        R.dwl = 0.5 * (Pc - Pp) * Math.abs(q0 - Q);
        R.consumerBurden = (Pc - p0) * Q;
        R.producerBurden = (p0 - Pp) * Q;
        R.csPoly = buildCSArea(D, Q, Pc);
        R.psPoly = buildPSArea(S, Q, Pp);
        return R;
      }
    }
  }

  /* ---------- per-unit subsidy ---------- */
  if (state.subsidy > 0) {
    const s = state.subsidy;
    let Se = null;
    if (S.type === 'normal') {
      Se = makeCurve({ q: S.raw.a.q, p: S.raw.a.p - s }, { q: S.raw.b.q, p: S.raw.b.p - s });
    } else if (S.isHorizontal) {
      Se = makeCurve({ q: S.raw.a.q, p: S.raw.a.p - s }, { q: S.raw.b.q, p: S.raw.b.p - s });
    } else if (S.isVertical) {
      Se = makeCurve({ q: S.q0, p: S.pMin - s }, { q: S.q0, p: S.pMax - s });
    }

    if (Se) {
      const eq = intersectCurves(D, Se);
      if (eq && eq.q > 0 && isFiniteNum(eq.p)) {
        const Q = eq.q;
        const Pc = pOnCurveAtQ(D, Q);
        const Pp = Pc + s;

        R.mode = 'subsidy';
        R.Q_traded = Q; R.Pc = Pc; R.Pp = Pp;
        R.cs = calcCSArea(D, Q, Pc);
        R.ps = calcPSArea(S, Q, Pp);
        R.subsidyCost = s * Q;
        R.tss = R.cs + R.ps - R.subsidyCost;
        R.dwl = 0.5 * s * Math.abs(Q - q0);
        R.consumerBurden = (p0 - Pc) * Q;
        R.producerBurden = (Pp - p0) * Q;
        R.csPoly = buildCSArea(D, Q, Pc);
        R.psPoly = buildPSArea(S, Q, Pp);
        return R;
      }
    }
  }

  /* ---------- base ---------- */
  R.mode = 'base';
  R.Q_traded = q0; R.Pc = p0; R.Pp = p0;
  R.cs = calcCSArea(D, q0, p0);
  R.ps = calcPSArea(S, q0, p0);
  R.tss = R.cs + R.ps;
  R.csPoly = buildCSArea(D, q0, p0);
  R.psPoly = buildPSArea(S, q0, p0);
  return R;
}

/* 面積計算（支援所有曲線類型） */
function calcCSArea(D, Q, Pc) {
  if (!isFiniteNum(Q) || Q <= 0 || !isFiniteNum(Pc)) return 0;
  if (D.isHorizontal) {
    return Math.max(0, (D.p0 - Pc) * Q);
  }
  if (D.isVertical) {
    return 0;  // 垂直 D：CS = 0
  }
  const p0 = D.at(0), pQ = D.at(Q);
  if (!isFiniteNum(p0) || !isFiniteNum(pQ)) return 0;
  // 梯形公式：(上底 + 下底) / 2 × 高
  const top = Math.max(0, p0 - Pc);
  const bot = Math.max(0, pQ - Pc);
  return (top + bot) / 2 * Q;
}

function calcPSArea(S, Q, Pp) {
  if (!isFiniteNum(Q) || Q <= 0 || !isFiniteNum(Pp)) return 0;
  if (S.isHorizontal) {
    return Math.max(0, (Pp - S.p0) * Q);
  }
  if (S.isVertical) {
    return 0;
  }
  const p0 = S.at(0), pQ = S.at(Q);
  if (!isFiniteNum(p0) || !isFiniteNum(pQ)) return 0;
  const top = Math.max(0, Pp - p0);
  const bot = Math.max(0, Pp - pQ);
  return (top + bot) / 2 * Q;
}

/* =========================================================
   render
   ========================================================= */
const svgEl = document.getElementById('chart');
const polyStr = pts => pts.map(([q, p]) => `${X(q)},${Y(p)}`).join(' ');

function defsStr() {
  return `<defs>
    <pattern id="patCS" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#E07A5F" opacity="0.10"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#E07A5F" stroke-width="1.3" opacity="0.42"/>
    </pattern>
    <pattern id="patPS" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#3D7A6A" opacity="0.10"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3D7A6A" stroke-width="1.3" opacity="0.42"/>
    </pattern>
    <pattern id="patTSS" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#5B7B9A" opacity="0.14"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#5B7B9A" stroke-width="1.4" opacity="0.5"/>
    </pattern>
    <pattern id="patTR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#6C63AC" opacity="0.13"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6C63AC" stroke-width="1.3" opacity="0.42"/>
    </pattern>
    <pattern id="patDWL" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#C4453D" opacity="0.16"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#C4453D" stroke-width="1.1" opacity="0.5"/>
    </pattern>
    <pattern id="patCons" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#D98F6B" opacity="0.14"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#D98F6B" stroke-width="1.2" opacity="0.5"/>
    </pattern>
    <pattern id="patProd" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#5A9B8A" opacity="0.14"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#5A9B8A" stroke-width="1.2" opacity="0.5"/>
    </pattern>
    <clipPath id="plotClip">
      <rect x="${PAD.l}" y="${PAD.t}" width="${PW}" height="${PH}"/>
    </clipPath>
  </defs>`;
}

function axisPLabel(pValue, label, color = '#141414', weight = '600') {
  if (!isFiniteNum(pValue) || pValue < 0 || pValue > 100) return '';
  return `<text x="${px(0) - 8}" y="${py(pValue) + 4}" text-anchor="end" font-size="12.5" font-weight="${weight}" fill="${color}" font-family="Inter,sans-serif">${label}</text>`;
}
function axisQLabel(qValue, label, color = '#141414', weight = '600') {
  if (!isFiniteNum(qValue) || qValue < 0 || qValue > 100) return '';
  return `<text x="${px(qValue)}" y="${py(0) + 18}" text-anchor="middle" font-size="12.5" font-weight="${weight}" fill="${color}" font-family="Inter,sans-serif">${label}</text>`;
}

/* 畫一條曲線（處理 vertical / horizontal / normal） */
function drawCurve(curve, color, label, labelOffset = { x: 10, y: -8 }) {
  const g = [];
  if (curve.isVertical) {
    const y1 = Y(clamp(curve.pMin, 0, 100));
    const y2 = Y(clamp(curve.pMax, 0, 100));
    g.push(`<line x1="${X(curve.q0)}" y1="${y1}" x2="${X(curve.q0)}" y2="${y2}" stroke="${color}" stroke-width="2" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
    g.push(`<text x="${X(curve.q0) + labelOffset.x}" y="${y2 + labelOffset.y}" font-size="14" font-weight="600" fill="${color}" font-family="Inter,sans-serif">${label}</text>`);
  } else if (curve.isHorizontal) {
    const x1 = X(clamp(curve.qMin, 0, 100));
    const x2 = X(clamp(curve.qMax, 0, 100));
    g.push(`<line x1="${x1}" y1="${Y(curve.p0)}" x2="${x2}" y2="${Y(curve.p0)}" stroke="${color}" stroke-width="2" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
    g.push(`<text x="${x2}" y="${Y(curve.p0) + labelOffset.y}" text-anchor="end" font-size="14" font-weight="600" fill="${color}" font-family="Inter,sans-serif">${label}</text>`);
  } else {
    // normal：搵可見線段
    const cands = [];
    const put = (q, p) => {
      if (q >= -0.01 && q <= 100.01 && p >= -0.01 && p <= 100.01) cands.push({ q, p });
    };
    put(0, curve.at(0));
    put(100, curve.at(100));
    if (Math.abs(curve.m) > 1e-12) {
      put(-curve.c / curve.m, 0);
      put((100 - curve.c) / curve.m, 100);
    }
    const uniq = [];
    for (const pt of cands) {
      if (isFiniteNum(pt.q) && isFiniteNum(pt.p) &&
          !uniq.some(u => Math.abs(u.q - pt.q) < 0.05 && Math.abs(u.p - pt.p) < 0.05)) {
        uniq.push(pt);
      }
    }
    if (uniq.length >= 2) {
      uniq.sort((a, b) => a.q - b.q);
      const seg = [uniq[0], uniq[uniq.length - 1]];
      g.push(`<line x1="${X(seg[0].q)}" y1="${Y(seg[0].p)}" x2="${X(seg[1].q)}" y2="${Y(seg[1].p)}" stroke="${color}" stroke-width="2" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
      const end = seg[1];
      const lq = clamp(end.q, 3, 97);
      const lp = clamp(end.p, 3, 97);
      g.push(`<text x="${X(lq) + (lq > 80 ? labelOffset.x - 24 : labelOffset.x)}" y="${Y(lp) + (lq > 80 ? -labelOffset.y : labelOffset.y)}" font-size="14" font-weight="600" fill="${color}" font-family="Inter,sans-serif">${label}</text>`);
    }
  }
  return g.join('');
}

function render() {
  const R = compute();
  const s = state.show;
  const g = [defsStr()];

  /* grid */
  for (let q = 20; q < 100; q += 20)
    g.push(`<line x1="${X(q)}" y1="${Y(0)}" x2="${X(q)}" y2="${Y(100)}" stroke="#F1F1EC" stroke-width="1"/>`);
  for (let p = 20; p < 100; p += 20)
    g.push(`<line x1="${X(0)}" y1="${Y(p)}" x2="${X(100)}" y2="${Y(p)}" stroke="#F1F1EC" stroke-width="1"/>`);

  /* axes */
  g.push(`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(100)}" y2="${Y(0)}" stroke="#D8D8D2" stroke-width="1.4" stroke-linecap="round"/>`);
  g.push(`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(100)}" stroke="#D8D8D2" stroke-width="1.4" stroke-linecap="round"/>`);
  g.push(`<text x="${px(100) - 2}" y="${py(0) + 34}" text-anchor="end" font-size="11.5" font-weight="500" fill="#9A9A94" font-family="Inter,sans-serif">Quantity</text>`);
  g.push(`<text x="${px(0) - 12}" y="${py(100) - 10}" text-anchor="end" font-size="11.5" font-weight="500" fill="#9A9A94" font-family="Inter,sans-serif">Price</text>`);

  /* Warning: parallel curves */
  if (R.warning) {
    g.push(`<text x="${px(50)}" y="${py(50)}" text-anchor="middle" font-size="13" font-weight="600" fill="#C4453D" font-family="Inter,'Noto Sans TC',sans-serif">⚠ ${R.warning}</text>`);
    g.push(`<text x="${px(50)}" y="${py(46)}" text-anchor="middle" font-size="11.5" fill="#9A9A94" font-family="Inter,'Noto Sans TC',sans-serif">曲線平行或無交點</text>`);
    // Still draw curves for reference
    g.push(drawCurve(R.D, '#E07A5F', 'D'));
    g.push(drawCurve(R.S, '#3D7A6A', 'S'));
    svgEl.innerHTML = g.join('');
    updateUI(R);
    return;
  }

  const Q_t = R.Q_traded;
  const Pc = R.Pc, Pp = R.Pp;
  const P0 = R.P0, Q0 = R.Q0;

  /* price line */
  if (R.priceLine !== null && R.priceLine !== undefined &&
      (state.priceCtrl.mode !== 'none' || state.world > 0)) {
    const y = Y(R.priceLine);
    let color = '#6C63AC';
    g.push(`<line x1="${X(0)}" y1="${y}" x2="${X(100)}" y2="${y}" stroke="${color}" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
  }

  /* quota line */
  if (R.quotaLine !== null && R.quotaLine !== undefined && state.quota > 0) {
    g.push(`<line x1="${X(R.quotaLine)}" y1="${Y(0)}" x2="${X(R.quotaLine)}" y2="${Y(100)}" stroke="#6C63AC" stroke-width="1.6" stroke-dasharray="6 4" clip-path="url(#plotClip)"/>`);
  }

  /* --- area fills --- */
  const csFill = s.cs ? 'url(#patCS)' : (s.tss ? 'url(#patTSS)' : null);
  const psFill = s.ps ? 'url(#patPS)' : (s.tss ? 'url(#patTSS)' : null);

  if (csFill && R.csPoly) {
    g.push(`<polygon points="${polyStr(R.csPoly)}" fill="${csFill}" clip-path="url(#plotClip)"/>`);
  }
  if (psFill && R.psPoly) {
    g.push(`<polygon points="${polyStr(R.psPoly)}" fill="${psFill}" clip-path="url(#plotClip)"/>`);
  }

  /* Consumer / Producer share */
  if ((R.mode === 'tax' || R.mode === 'advalorem' || R.mode === 'subsidy') &&
      isFiniteNum(Q_t) && isFiniteNum(P0)) {
    if (s.consumerShare && isFiniteNum(Pc)) {
      const rect = [[0, Pc], [Q_t, Pc], [Q_t, P0], [0, P0]];
      g.push(`<polygon points="${polyStr(rect)}" fill="url(#patCons)" clip-path="url(#plotClip)"/>`);
    }
    if (s.producerShare && isFiniteNum(Pp)) {
      const rect = [[0, P0], [Q_t, P0], [Q_t, Pp], [0, Pp]];
      g.push(`<polygon points="${polyStr(rect)}" fill="url(#patProd)" clip-path="url(#plotClip)"/>`);
    }
  }

  /* Tax revenue / subsidy cost */
  if ((s.tr && (R.mode === 'tax' || R.mode === 'advalorem')) &&
      isFiniteNum(Q_t) && isFiniteNum(Pc) && isFiniteNum(Pp)) {
    const rect = [[0, Pc], [Q_t, Pc], [Q_t, Pp], [0, Pp]];
    g.push(`<polygon points="${polyStr(rect)}" fill="url(#patTR)" clip-path="url(#plotClip)"/>`);
  }
  if (s.subsidyCost && R.mode === 'subsidy' &&
      isFiniteNum(Q_t) && isFiniteNum(Pc) && isFiniteNum(Pp)) {
    const rect = [[0, Pp], [Q_t, Pp], [Q_t, Pc], [0, Pc]];
    g.push(`<polygon points="${polyStr(rect)}" fill="url(#patTR)" clip-path="url(#plotClip)"/>`);
  }

  /* DWL — 只在 DWL > 0 且有實際面積時畫 */
  if (s.dwl && R.dwl > 0.1 && R.base && isFiniteNum(Q_t) && Q_t !== R.base.q) {
    const qA = Q_t, qB = R.base.q;
    const pDA = pOnCurveAtQ(R.D, qA);
    const pDB = pOnCurveAtQ(R.D, qB);
    const pSA = pOnCurveAtQ(R.S, qA);
    const pSB = pOnCurveAtQ(R.S, qB);
    if (isFiniteNum(pDA) && isFiniteNum(pDB) && isFiniteNum(pSA) && isFiniteNum(pSB)) {
      const tri = [[qA, pDA], [qB, pDB], [qA, pSA]];
      g.push(`<polygon points="${polyStr(tri)}" fill="url(#patDWL)" clip-path="url(#plotClip)"/>`);
    }
  }

  /* tax wedge vertical line */
  if ((R.mode === 'tax' || R.mode === 'advalorem') && isFiniteNum(Q_t) && isFiniteNum(Pc) && isFiniteNum(Pp)) {
    g.push(`<line x1="${X(Q_t)}" y1="${Y(Pc)}" x2="${X(Q_t)}" y2="${Y(Pp)}" stroke="#6C63AC" stroke-width="1.8" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
  }

  /* --- curves --- */
  g.push(drawCurve(R.D, '#E07A5F', 'D', { x: 10, y: -8 }));
  g.push(drawCurve(R.S, '#3D7A6A', 'S', { x: 10, y: -8 }));

  /* shifted curves */
  if (R.mode === 'tax' && state.tax > 0) {
    const t = state.tax;
    let Se = null;
    if (R.S.type === 'normal') Se = makeCurve({ q: R.S.raw.a.q, p: R.S.raw.a.p + t }, { q: R.S.raw.b.q, p: R.S.raw.b.p + t });
    else if (R.S.isHorizontal) Se = makeCurve({ q: R.S.raw.a.q, p: R.S.raw.a.p + t }, { q: R.S.raw.b.q, p: R.S.raw.b.p + t });
    else if (R.S.isVertical) Se = makeCurve({ q: R.S.q0, p: R.S.pMin + t }, { q: R.S.q0, p: R.S.pMax + t });
    if (Se) {
      const dashed = drawCurve(Se, '#6C63AC', 'S+t', { x: 10, y: -8 }).replace(/stroke-width="2"/g, 'stroke-width="1.6" stroke-dasharray="5 4"');
      g.push(dashed);
    }
  }
  if (R.mode === 'advalorem' && state.advalorem > 0) {
    const k = 1 + state.advalorem / 100;
    let Se = null;
    if (R.S.type === 'normal') Se = makeCurve({ q: R.S.raw.a.q, p: R.S.raw.a.p * k }, { q: R.S.raw.b.q, p: R.S.raw.b.p * k });
    else if (R.S.isHorizontal) Se = makeCurve({ q: R.S.raw.a.q, p: R.S.raw.a.p * k }, { q: R.S.raw.b.q, p: R.S.raw.b.p * k });
    else if (R.S.isVertical) Se = makeCurve({ q: R.S.q0, p: R.S.pMin * k }, { q: R.S.q0, p: R.S.pMax * k });
    if (Se) {
      const dashed = drawCurve(Se, '#6C63AC', 'S(1+t)', { x: 10, y: -8 }).replace(/stroke-width="2"/g, 'stroke-width="1.6" stroke-dasharray="5 4"');
      g.push(dashed);
    }
  }
  if (R.mode === 'subsidy' && state.subsidy > 0) {
    const sub = state.subsidy;
    let Se = null;
    if (R.S.type === 'normal') Se = makeCurve({ q: R.S.raw.a.q, p: R.S.raw.a.p - sub }, { q: R.S.raw.b.q, p: R.S.raw.b.p - sub });
    else if (R.S.isHorizontal) Se = makeCurve({ q: R.S.raw.a.q, p: R.S.raw.a.p - sub }, { q: R.S.raw.b.q, p: R.S.raw.b.p - sub });
    else if (R.S.isVertical) Se = makeCurve({ q: R.S.q0, p: R.S.pMin - sub }, { q: R.S.q0, p: R.S.pMax - sub });
    if (Se) {
      const dashed = drawCurve(Se, '#6C63AC', 'S−s', { x: 10, y: -8 }).replace(/stroke-width="2"/g, 'stroke-width="1.6" stroke-dasharray="5 4"');
      g.push(dashed);
    }
  }

  /* --- equilibrium markers --- */
  const hasIntervention = state.tax > 0 || state.advalorem > 0 || state.subsidy > 0 ||
                          state.priceCtrl.mode !== 'none' || state.quota > 0 || state.world > 0;

  if (hasIntervention && R.base && isFiniteNum(R.base.q) && isFiniteNum(R.base.p) &&
      R.base.q >= 0 && R.base.q <= 100 && R.base.p >= 0 && R.base.p <= 100) {
    g.push(`<circle cx="${X(R.base.q)}" cy="${Y(R.base.p)}" r="3.5" fill="none" stroke="#9A9A94" stroke-width="1.4" clip-path="url(#plotClip)"/>`);
    g.push(`<text x="${px(R.base.q) + 10}" y="${py(R.base.p) - 8}" font-size="11.5" font-weight="500" fill="#9A9A94" font-family="Inter,sans-serif">E₀</text>`);
    g.push(`<line x1="${X(0)}" y1="${Y(R.base.p)}" x2="${X(R.base.q)}" y2="${Y(R.base.p)}" stroke="#9A9A94" stroke-width="1" stroke-dasharray="3 4" opacity="0.55" clip-path="url(#plotClip)"/>`);
    g.push(`<line x1="${X(R.base.q)}" y1="${Y(R.base.p)}" x2="${X(R.base.q)}" y2="${Y(0)}" stroke="#9A9A94" stroke-width="1" stroke-dasharray="3 4" opacity="0.55" clip-path="url(#plotClip)"/>`);
    g.push(axisPLabel(R.base.p, 'P₀', '#9A9A94', '500'));
    g.push(axisQLabel(R.base.q, 'Q₀', '#9A9A94', '500'));
  }

  if (isFiniteNum(Q_t) && Q_t > 0 && isFiniteNum(Pc) && Pc >= 0 && Pc <= 100) {
    g.push(`<circle cx="${X(Q_t)}" cy="${Y(Pc)}" r="5.5" fill="#141414" clip-path="url(#plotClip)"/>`);
    g.push(`<circle cx="${X(Q_t)}" cy="${Y(Pc)}" r="9" fill="none" stroke="#141414" stroke-width="1" opacity="0.18" clip-path="url(#plotClip)"/>`);

    if (R.mode === 'base') {
      g.push(`<line x1="${X(0)}" y1="${Y(Pc)}" x2="${X(Q_t)}" y2="${Y(Pc)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
      g.push(`<line x1="${X(Q_t)}" y1="${Y(Pc)}" x2="${X(Q_t)}" y2="${Y(0)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
      g.push(axisPLabel(Pc, 'P₁'));
      g.push(axisQLabel(Q_t, 'Q₁'));
      g.push(`<text x="${px(Q_t) + 12}" y="${py(Pc) - 10}" font-size="12" font-weight="600" fill="#141414" font-family="Inter,sans-serif">E₁</text>`);
    }
  }

  /* tax / subsidy / ad valorem price labels */
  if ((R.mode === 'tax' || R.mode === 'advalorem') && isFiniteNum(Q_t)) {
    if (isFiniteNum(Pc)) {
      g.push(`<line x1="${X(0)}" y1="${Y(Pc)}" x2="${X(Q_t)}" y2="${Y(Pc)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
      g.push(axisPLabel(Pc, 'P<sub>c</sub>', '#6C63AC'));
    }
    if (isFiniteNum(Pp)) {
      g.push(`<line x1="${X(0)}" y1="${Y(Pp)}" x2="${X(Q_t)}" y2="${Y(Pp)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
      g.push(axisPLabel(Pp, 'P<sub>p</sub>', '#6C63AC'));
    }
    g.push(`<line x1="${X(Q_t)}" y1="${Y(Pc)}" x2="${X(Q_t)}" y2="${Y(0)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
    g.push(axisQLabel(Q_t, 'Q₁'));
    g.push(`<text x="${px(Q_t) + 12}" y="${py(Pc) - 10}" font-size="12" font-weight="600" fill="#141414" font-family="Inter,sans-serif">E₁</text>`);
    if (isFiniteNum(Pc) && isFiniteNum(Pp)) {
      const midP = (Pc + Pp) / 2;
      if (Math.abs(Pc - Pp) > 3) {
        g.push(`<text x="${px(Q_t) - 8}" y="${py(midP) + 4}" text-anchor="end" font-size="11" font-weight="600" fill="#6C63AC" font-family="Inter,sans-serif">t</text>`);
      }
    }
  }

  if (R.mode === 'subsidy' && isFiniteNum(Q_t)) {
    if (isFiniteNum(Pc)) {
      g.push(`<line x1="${X(0)}" y1="${Y(Pc)}" x2="${X(Q_t)}" y2="${Y(Pc)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
      g.push(axisPLabel(Pc, 'P<sub>c</sub>', '#6C63AC'));
    }
    if (isFiniteNum(Pp)) {
      g.push(`<line x1="${X(0)}" y1="${Y(Pp)}" x2="${X(Q_t)}" y2="${Y(Pp)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
      g.push(axisPLabel(Pp, 'P<sub>p</sub>', '#6C63AC'));
    }
    g.push(`<line x1="${X(Q_t)}" y1="${Y(Pp)}" x2="${X(Q_t)}" y2="${Y(0)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
    g.push(axisQLabel(Q_t, 'Q₂'));
    g.push(`<text x="${px(Q_t) + 12}" y="${py(Pc) - 10}" font-size="12" font-weight="600" fill="#141414" font-family="Inter,sans-serif">E₂</text>`);
    if (isFiniteNum(Pc) && isFiniteNum(Pp)) {
      const midP = (Pc + Pp) / 2;
      if (Math.abs(Pc - Pp) > 3) {
        g.push(`<text x="${px(Q_t) - 8}" y="${py(midP) + 4}" text-anchor="end" font-size="11" font-weight="600" fill="#6C63AC" font-family="Inter,sans-serif">s</text>`);
      }
    }
  }

  /* ceiling */
  if (R.mode === 'ceiling' && isFiniteNum(R.priceLine)) {
    const Qs = qOnCurveAtP(R.S, R.priceLine);
    const Qd = qOnCurveAtP(R.D, R.priceLine);
    if (isFiniteNum(Qs)) {
      g.push(`<line x1="${X(Qs)}" y1="${Y(R.priceLine)}" x2="${X(Qs)}" y2="${Y(0)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
      g.push(axisQLabel(Qs, 'Q<sub>s</sub>'));
    }
    if (isFiniteNum(Qd) && isFiniteNum(Qs) && Qd > Qs + 1) {
      g.push(`<line x1="${X(Qd)}" y1="${Y(R.priceLine)}" x2="${X(Qd)}" y2="${Y(0)}" stroke="#9A9A94" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
      g.push(axisQLabel(Qd, 'Q<sub>d</sub>', '#9A9A94', '500'));
      const y = py(R.priceLine);
      g.push(`<line x1="${X(Qs)}" y1="${y}" x2="${X(Qd)}" y2="${y}" stroke="#C4453D" stroke-width="2.4" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
      g.push(`<text x="${px((Qs + Qd) / 2)}" y="${y + 18}" text-anchor="middle" font-size="11" font-weight="600" fill="#C4453D" font-family="Inter,sans-serif">Shortage</text>`);
    }
    g.push(axisPLabel(R.priceLine, 'P<sub>c</sub>', '#6C63AC'));
  }

  /* floor */
  if (R.mode === 'floor' && isFiniteNum(R.priceLine)) {
    const Qd = qOnCurveAtP(R.D, R.priceLine);
    const Qs = qOnCurveAtP(R.S, R.priceLine);
    if (isFiniteNum(Qd)) {
      g.push(`<line x1="${X(Qd)}" y1="${Y(R.priceLine)}" x2="${X(Qd)}" y2="${Y(0)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
      g.push(axisQLabel(Qd, 'Q<sub>d</sub>'));
    }
    if (isFiniteNum(Qs) && isFiniteNum(Qd) && Qs > Qd + 1) {
      g.push(`<line x1="${X(Qs)}" y1="${Y(R.priceLine)}" x2="${X(Qs)}" y2="${Y(0)}" stroke="#9A9A94" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
      g.push(axisQLabel(Qs, 'Q<sub>s</sub>', '#9A9A94', '500'));
      const y = py(R.priceLine);
      g.push(`<line x1="${X(Qd)}" y1="${y}" x2="${X(Qs)}" y2="${y}" stroke="#C4453D" stroke-width="2.4" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
      g.push(`<text x="${px((Qd + Qs) / 2)}" y="${y - 12}" text-anchor="middle" font-size="11" font-weight="600" fill="#C4453D" font-family="Inter,sans-serif">Surplus</text>`);
    }
    g.push(axisPLabel(R.priceLine, 'P<sub>f</sub>', '#6C63AC'));
  }

  /* quota */
  if (R.mode === 'quota' && isFiniteNum(R.quotaLine)) {
    g.push(`<line x1="${X(R.quotaLine)}" y1="${Y(R.Pc)}" x2="${X(R.quotaLine)}" y2="${Y(0)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
    g.push(`<line x1="${X(0)}" y1="${Y(R.Pc)}" x2="${X(R.quotaLine)}" y2="${Y(R.Pc)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
    g.push(axisPLabel(R.Pc, 'P<sub>q</sub>', '#6C63AC'));
    g.push(axisQLabel(R.quotaLine, 'Q<sub>q</sub>'));
    g.push(`<text x="${px(R.quotaLine) + 8}" y="${py(96)}" font-size="11" font-weight="600" fill="#6C63AC" font-family="Inter,sans-serif">Quota</text>`);
  }

  /* world */
  if (R.mode === 'world' && isFiniteNum(R.worldP)) {
    const a = R.worldQd, b = R.worldQs;
    if (isFiniteNum(a)) {
      g.push(`<line x1="${X(a)}" y1="${Y(R.worldP)}" x2="${X(a)}" y2="${Y(0)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
      g.push(axisQLabel(a, 'Q<sub>d</sub>'));
    }
    if (isFiniteNum(b)) {
      g.push(`<line x1="${X(b)}" y1="${Y(R.worldP)}" x2="${X(b)}" y2="${Y(0)}" stroke="#141414" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" clip-path="url(#plotClip)"/>`);
      g.push(axisQLabel(b, 'Q<sub>s</sub>'));
    }
    g.push(axisPLabel(R.worldP, 'P<sub>w</sub>', '#6C63AC'));
    if (isFiniteNum(a) && isFiniteNum(b) && Math.abs(a - b) > 1) {
      const y = py(R.worldP);
      g.push(`<line x1="${X(Math.min(a, b))}" y1="${y}" x2="${X(Math.max(a, b))}" y2="${y}" stroke="#6C63AC" stroke-width="2.4" stroke-linecap="round" clip-path="url(#plotClip)"/>`);
      g.push(`<text x="${px((a + b) / 2)}" y="${y + (R.tradeType === 'import' ? 18 : -12)}" text-anchor="middle" font-size="11" font-weight="600" fill="#6C63AC" font-family="Inter,sans-serif">${R.tradeType === 'import' ? 'Imports' : 'Exports'}</text>`);
    }
  }

  /* drag handles */
  const dh = state.demand, sh = state.supply;
  const handles = [
    { q: dh.a.q, p: dh.a.p, cls: 'demand', h: 'a' },
    { q: dh.b.q, p: dh.b.p, cls: 'demand', h: 'b' },
    { q: sh.a.q, p: sh.a.p, cls: 'supply', h: 'a' },
    { q: sh.b.q, p: sh.b.p, cls: 'supply', h: 'b' },
  ];
  const colorMap = { demand: '#E07A5F', supply: '#3D7A6A' };
  for (const H of handles) {
    const cx = X(H.q), cy = Y(H.p), col = colorMap[H.cls];
    g.push(`<circle cx="${cx}" cy="${cy}" r="17" fill="transparent" style="cursor:grab" data-drag="${H.cls}" data-handle="${H.h}"/>`);
    g.push(`<circle cx="${cx}" cy="${cy}" r="6.5" fill="#FFFFFF" stroke="${col}" stroke-width="2.2" pointer-events="none"/>`);
  }
  // curve-body drag: only for normal curves
  if (R.D.type === 'normal') {
    const cands = [];
    const put = (q, p) => { if (q >= -0.01 && q <= 100.01 && p >= -0.01 && p <= 100.01) cands.push({ q, p }); };
    put(0, R.D.at(0)); put(100, R.D.at(100));
    put(-R.D.c / R.D.m, 0); put((100 - R.D.c) / R.D.m, 100);
    const uniq = [];
    for (const pt of cands) {
      if (isFiniteNum(pt.q) && isFiniteNum(pt.p) && !uniq.some(u => Math.abs(u.q - pt.q) < 0.05 && Math.abs(u.p - pt.p) < 0.05)) uniq.push(pt);
    }
    if (uniq.length >= 2) {
      uniq.sort((a, b) => a.q - b.q);
      const seg = [uniq[0], uniq[uniq.length - 1]];
      g.push(`<line x1="${X(seg[0].q)}" y1="${Y(seg[0].p)}" x2="${X(seg[1].q)}" y2="${Y(seg[1].p)}" stroke="transparent" stroke-width="26" style="cursor:grab" data-drag="demand" clip-path="url(#plotClip)"/>`);
    }
  }
  if (R.S.type === 'normal') {
    const cands = [];
    const put = (q, p) => { if (q >= -0.01 && q <= 100.01 && p >= -0.01 && p <= 100.01) cands.push({ q, p }); };
    put(0, R.S.at(0)); put(100, R.S.at(100));
    put(-R.S.c / R.S.m, 0); put((100 - R.S.c) / R.S.m, 100);
    const uniq = [];
    for (const pt of cands) {
      if (isFiniteNum(pt.q) && isFiniteNum(pt.p) && !uniq.some(u => Math.abs(u.q - pt.q) < 0.05 && Math.abs(u.p - pt.p) < 0.05)) uniq.push(pt);
    }
    if (uniq.length >= 2) {
      uniq.sort((a, b) => a.q - b.q);
      const seg = [uniq[0], uniq[uniq.length - 1]];
      g.push(`<line x1="${X(seg[0].q)}" y1="${Y(seg[0].p)}" x2="${X(seg[1].q)}" y2="${Y(seg[1].p)}" stroke="transparent" stroke-width="26" style="cursor:grab" data-drag="supply" clip-path="url(#plotClip)"/>`);
    }
  }

  svgEl.innerHTML = g.join('');
  updateUI(R);
}

/* =========================================================
   UI update
   ========================================================= */
function fmt(n) {
  if (!isFiniteNum(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1000) return Math.round(n).toLocaleString('en-US');
  return (Math.round(n * 10) / 10).toFixed(1).replace(/\.0$/, '');
}

function updateUI(R) {
  const out = [];

  if (R.warning) {
    out.push(`<span class="ri warn">⚠ ${R.warning}</span>`);
  }

  if (isFiniteNum(R.Q_traded)) {
    out.push(`<span class="ri">Q <span class="rv num">${fmt(R.Q_traded)}</span></span>`);
    if (R.mode === 'tax' || R.mode === 'advalorem' || R.mode === 'subsidy') {
      out.push(`<span class="ri">P<sub>c</sub> <span class="rv num">${fmt(R.Pc)}</span></span>`);
      out.push(`<span class="ri">P<sub>p</sub> <span class="rv num">${fmt(R.Pp)}</span></span>`);
    } else {
      out.push(`<span class="ri">P <span class="rv num">${fmt(R.Pc)}</span></span>`);
    }
  }
  if (state.show.cs) out.push(`<span class="ri">CS <span class="rv num" style="color:#E07A5F">${fmt(R.cs)}</span></span>`);
  if (state.show.ps) out.push(`<span class="ri">PS <span class="rv num" style="color:#3D7A6A">${fmt(R.ps)}</span></span>`);
  if (state.show.tss) out.push(`<span class="ri">TSS <span class="rv num" style="color:#5B7B9A;font-weight:600">${fmt(R.tss)}</span></span>`);
  if (state.show.tr && (R.mode === 'tax' || R.mode === 'advalorem')) out.push(`<span class="ri">Tax Rev. <span class="rv num" style="color:#6C63AC">${fmt(R.tr)}</span></span>`);
  if (state.show.subsidyCost && R.mode === 'subsidy') out.push(`<span class="ri">Subsidy Cost <span class="rv num" style="color:#6C63AC">${fmt(R.subsidyCost)}</span></span>`);
  if (state.show.dwl) out.push(`<span class="ri">DWL <span class="rv num" style="color:#C4453D">${fmt(R.dwl)}</span></span>`);
  if (state.show.consumerShare && (R.mode === 'tax' || R.mode === 'advalorem')) {
    out.push(`<span class="ri">Consumer Burden <span class="rv num" style="color:#D98F6B">${fmt(R.consumerBurden)} (${(R.consumerBurden / Math.max(1, R.tr) * 100).toFixed(0)}%)</span></span>`);
  }
  if (state.show.consumerShare && R.mode === 'subsidy') {
    out.push(`<span class="ri">Consumer Gain <span class="rv num" style="color:#D98F6B">${fmt(R.consumerBurden)}</span></span>`);
  }
  if (state.show.producerShare && (R.mode === 'tax' || R.mode === 'advalorem')) {
    out.push(`<span class="ri">Producer Burden <span class="rv num" style="color:#5A9B8A">${fmt(R.producerBurden)} (${(R.producerBurden / Math.max(1, R.tr) * 100).toFixed(0)}%)</span></span>`);
  }
  if (state.show.producerShare && R.mode === 'subsidy') {
    out.push(`<span class="ri">Producer Gain <span class="rv num" style="color:#5A9B8A">${fmt(R.producerBurden)}</span></span>`);
  }
  document.getElementById('readout').innerHTML = out.join('');

  const hints = {
    base: { en: 'Drag D or S to shift; drag endpoints to change slope.', zh: '拖動 D 或 S 平移；拖端點改斜率。' },
    tax: { en: 'Tax wedge: Pc above, Pp below. Q falls, DWL appears.', zh: '稅楔：Pc 在上、Pp 在下。Q 下降，出現 DWL。' },
    advalorem: { en: 'Ad valorem tax rotates S; tax amount varies with price.', zh: '從價稅令 S 旋轉，稅額隨價格改變。' },
    subsidy: { en: 'Subsidy shifts S down. Q rises; DWL beyond Q₀.', zh: '補貼令 S 下移。Q 上升，Q₀ 之後出現 DWL。' },
    ceiling: { en: 'Ceiling below equilibrium → shortage.', zh: '上限低於均衡 → 短缺。' },
    floor: { en: 'Floor above equilibrium → surplus.', zh: '下限高於均衡 → 盈餘。' },
    quota: { en: 'Quota caps quantity; PS becomes trapezoid.', zh: '配額限制數量；PS 變成梯形。' },
    world: { en: 'World price below equilibrium → imports; above → exports.', zh: '世界價格低於均衡 → 進口；高於均衡 → 出口。' }
  };
  const h = hints[R.mode] || { en: '', zh: '' };
  document.getElementById('hint').innerHTML = h.en ? `${h.en}<span class="zh">${h.zh}</span>` : '';

  document.getElementById('taxVal').textContent = state.tax > 0 ? `+${state.tax}` : '0';
  document.getElementById('taxVal').classList.toggle('on', state.tax > 0);
  document.getElementById('advVal').textContent = state.advalorem > 0 ? `${state.advalorem}%` : '0%';
  document.getElementById('advVal').classList.toggle('on', state.advalorem > 0);
  document.getElementById('subVal').textContent = state.subsidy > 0 ? `-${state.subsidy}` : '0';
  document.getElementById('subVal').classList.toggle('on', state.subsidy > 0);

  const pcNames = { none: 'Off', ceiling: 'Ceiling', floor: 'Floor' };
  document.getElementById('pcVal').textContent =
    state.priceCtrl.mode === 'none' ? 'Off' : `${pcNames[state.priceCtrl.mode]} ${state.priceCtrl.value}`;
  document.getElementById('pcVal').classList.toggle('on', state.priceCtrl.mode !== 'none');

  document.getElementById('quotaVal').textContent = state.quota > 0 ? `Q = ${state.quota}` : 'Off';
  document.getElementById('quotaVal').classList.toggle('on', state.quota > 0);

  document.getElementById('worldVal').textContent = state.world > 0 ? `Pw = ${state.world}` : 'Off';
  document.getElementById('worldVal').classList.toggle('on', state.world > 0);

  // PED / PES 顯示
  const ped = pedFromSlider(+document.getElementById('pedRange').value);
  const pes = pesFromSlider(+document.getElementById('pesRange').value);
  document.getElementById('pedVal').textContent = ped.label;
  document.getElementById('pesVal').textContent = pes.label;
}

/* ---------- elasticity slider ---------- */
function pedFromSlider(v) {
  if (v >= 100) return { m: 0, label: '∞ (perfectly elastic)' };
  if (v <= 0) return { m: null, label: '0 (perfectly inelastic)' };
  const logAbsM = 3 - 6 * (v / 100);
  const absM = Math.pow(10, logAbsM);
  const m = -absM;
  return { m, label: `slope ≈ ${m.toFixed(2)}` };
}
function pesFromSlider(v) {
  if (v >= 100) return { m: 0, label: '∞ (perfectly elastic)' };
  if (v <= 0) return { m: null, label: '0 (perfectly inelastic)' };
  const logAbsM = 3 - 6 * (v / 100);
  const absM = Math.pow(10, logAbsM);
  const m = absM;
  return { m, label: `slope ≈ ${m.toFixed(2)}` };
}

/* =========================================================
   drag
   ========================================================= */
let drag = null;

function toData(e) {
  const rect = svgEl.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * VW;
  const y = (e.clientY - rect.top) / rect.height * VH;
  return {
    q: ((x - PAD.l) / PW) * QMAX,
    p: ((PAD.t + PH - y) / PH) * PMAX
  };
}

function clampPair(a, b) {
  const minQ = Math.min(a.q, b.q), maxQ = Math.max(a.q, b.q);
  let shiftQ = 0;
  if (minQ < 0) shiftQ = -minQ;
  else if (maxQ > 100) shiftQ = 100 - maxQ;
  a.q += shiftQ; b.q += shiftQ;

  const minP = Math.min(a.p, b.p), maxP = Math.max(a.p, b.p);
  let shiftP = 0;
  if (minP < 0) shiftP = -minP;
  else if (maxP > 100) shiftP = 100 - maxP;
  a.p += shiftP; b.p += shiftP;
  return [a, b];
}

svgEl.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]');
  if (!el) return;
  e.preventDefault();

  const which = el.dataset.drag;
  const handle = el.dataset.handle || null;
  const src = which === 'demand' ? state.demand : state.supply;

  drag = {
    which, handle,
    start: toData(e),
    orig: { a: { ...src.a }, b: { ...src.b } }
  };

  window.addEventListener('pointermove', onDragMove, { passive: false });
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', onDragEnd);
});

function onDragMove(e) {
  if (!drag) return;
  e.preventDefault();
  const pt = toData(e);
  const o = drag.orig;
  const target = drag.which === 'demand' ? state.demand : state.supply;

  if (drag.handle) {
    const other = drag.handle === 'a' ? o.b : o.a;
    let q = clamp(pt.q, 0, 100);
    let p = clamp(pt.p, 0, 100);
    // 防止兩點太近（特別係垂直/水平線）
    if (Math.abs(q - other.q) < 2) q = other.q + (q >= other.q ? 2 : -2);
    if (Math.abs(p - other.p) < 2) p = other.p + (p >= other.p ? 2 : -2);
    q = clamp(q, 0, 100);
    p = clamp(p, 0, 100);
    target[drag.handle] = { q, p };
  } else {
    let dq = pt.q - drag.start.q;
    let dp = pt.p - drag.start.p;

    const minQ = Math.min(o.a.q, o.b.q), maxQ = Math.max(o.a.q, o.b.q);
    dq = clamp(dq, -minQ, 100 - maxQ);

    const minP = Math.min(o.a.p, o.b.p), maxP = Math.max(o.a.p, o.b.p);
    dp = clamp(dp, -minP, 100 - maxP);

    target.a = { q: o.a.q + dq, p: o.a.p + dp };
    target.b = { q: o.b.q + dq, p: o.b.p + dp };
  }
  render();
}

function onDragEnd() {
  drag = null;
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);

/* 彈性 slider：極端值直接設 vertical / horizontal */
function rotateCurve(pts, m, mode) {
  // mode: 'normal' | 'vertical' | 'horizontal'
  const mid = { q: (pts.a.q + pts.b.q) / 2, p: (pts.a.p + pts.b.p) / 2 };

  if (mode === 'vertical') {
    // 完全無彈性：q = mid.q，p 範圍 [10, 90]
    return [
      { q: mid.q, p: 10 },
      { q: mid.q, p: 90 }
    ];
  }
  if (mode === 'horizontal') {
    return [
      { q: 10, p: mid.p },
      { q: 90, p: mid.p }
    ];
  }
  // normal
  const span = 50;
  const A = { q: mid.q - span, p: mid.p - m * span };
  const b = { q: mid.q + span, p: mid.p + m * span };
  return clampPair(A, b);
}

document.getElementById('pedRange').addEventListener('input', e => {
  const v = +e.target.value;
  const { m } = pedFromSlider(v);
  let a, b;
  if (v <= 0) {
    [a, b] = rotateCurve(state.demand, 0, 'vertical');
  } else if (v >= 100) {
    [a, b] = rotateCurve(state.demand, 0, 'horizontal');
  } else {
    [a, b] = rotateCurve(state.demand, m, 'normal');
  }
  state.demand = { a, b };
  render();
});

function setElasticity(pedV, pesV) {
  document.getElementById('pedRange').value = pedV;
  document.getElementById('pesRange').value = pesV;

  let da, db, sa, sb;

  // Demand
  if (pedV <= 0) {
    [da, db] = rotateCurve(state.demand, 0, 'vertical');
  } else if (pedV >= 100) {
    [da, db] = rotateCurve(state.demand, 0, 'horizontal');
  } else {
    const { m } = pedFromSlider(pedV);
    [da, db] = rotateCurve(state.demand, m, 'normal');
  }
  state.demand = { a: da, b: db };

  // Supply
  if (pesV <= 0) {
    [sa, sb] = rotateCurve(state.supply, 0, 'vertical');
  } else if (pesV >= 100) {
    [sa, sb] = rotateCurve(state.supply, 0, 'horizontal');
  } else {
    const { m } = pesFromSlider(pesV);
    [sa, sb] = rotateCurve(state.supply, m, 'normal');
  }
  state.supply = { a: sa, b: sb };
}

   Practice / history
   ========================================================= */
const HISTORY_KEY = 'econmush_history_v4';

function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
}
function pushHistory(rec) {
  const h = getHistory();
  h.push({ ...rec, ts: Date.now() });
  if (h.length > 60) h.shift();
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); } catch {}
}
function getNextDifficulty() {
  const h = getHistory();
  if (h.length < 3) return 'medium';
  const recent = h.slice(-5);
  const avg = recent.reduce((s, r) => s + r.score / Math.max(1, r.total), 0) / recent.length;
  if (avg > 0.75) return 'hard';
  if (avg < 0.4) return 'easy';
  return 'medium';
}
function renderHistoryNote() {
  const h = getHistory();
  const note = document.getElementById('historyNote');
  const text = document.getElementById('historyText');
  if (h.length === 0) { note.style.display = 'none'; return; }
  note.style.display = 'flex';
  const recent = h.slice(-5);
  const avg = Math.round(recent.reduce((s, r) => s + r.score / Math.max(1, r.total), 0) / recent.length * 100);
  text.innerHTML = `${h.length} questions done · last 5 avg ${avg}% — difficulty auto-adjusts<span class="zh">已完成 ${h.length} 題 · 最近 5 題平均 ${avg}% · 難度自動調整</span>`;
}
function updateDiffBadge() {
  const d = getNextDifficulty();
  const badge = document.getElementById('diffBadge');
  badge.className = `diff-badge ${d}`;
  badge.textContent = d.charAt(0).toUpperCase() + d.slice(1);
}

  { en: 'Consumer Surplus', zh: '消費者剩餘' },
